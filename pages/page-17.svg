<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Custodire e trasmettere</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Dai saperi antichi alla scuola</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Le società antiche non conservarono tutte le conoscenze allo stesso modo. Il manuale</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">propone il confronto tra ambienti mediterranei e tradizioni celtiche: insegnamento, ritualità,</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">memoria e scrittura assumono forme diverse. La diversità dei mezzi di trasmissione non</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">permette di ordinare automaticamente intere comunità dalla più sapiente alla meno sapiente.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una tradizione affidata alla memoria richiede continuità tra persone. Un testo può circolare</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">oltre il proprio autore, ma può anche essere copiato male, tradotto o sottratto alla</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">consultazione. La conservazione non coincide quindi con l’accesso: un sapere custodito può</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rimanere sconosciuto a gran parte della comunità.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Hogwarts si comprende meglio all’interno di questa lunga storia dell’insegnamento. La</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">scuola riunisce allievi, maestri e materiali in un luogo riconoscibile. Non inventa ogni</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">conoscenza che trasmette e non cancella immediatamente gli apprendimenti familiari. Il</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">primo anno si conclude collegando origini, conservazione e responsabilità di chi insegna.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezioni 1–2; Manuale, II anno, civiltà mediterranee e Celti.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">17</text></svg>