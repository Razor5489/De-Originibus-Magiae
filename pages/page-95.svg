<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il laboratorio degli archivisti</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Confrontare documenti senza inventare una soluzione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Per un esercizio si possono predisporre fonti di provenienza assunta come autentica. Questa</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">convenzione non rende vere tutte le informazioni contenute. Il confronto serve a distinguere</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">ciò che un documento afferma, ciò che permette di concludere e ciò che il lettore vi</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">aggiunge.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel fascicolo didattico del programma, un registro del 1732 descrive la continuità generale</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">delle lezioni; una lettera menziona alcuni corridoi chiusi. Le due informazioni non sono</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">necessariamente incompatibili. La chiusura locale può coesistere con un’attività scolastica</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">regolare, senza che questo riveli il motivo della chiusura.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un secondo gruppo di documenti immaginari, datati 1874 per l’esercizio, riguarda una</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">proposta sulle botteghe. Un articolo descrive opinioni contrarie, un ufficio segnala una</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">valutazione in corso e una testimonianza privata riferisce timori familiari. Nessuna di queste</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">notizie dimostra da sola che la proposta sia stata approvata o che abbia prodotto gli effetti</text><text x="52" y="417" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">temuti.</text><text x="52" y="447" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 13, fascicolo didattico; riassunti rielaborati.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">95</text></svg>