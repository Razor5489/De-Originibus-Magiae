<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La Crisi di Norwich</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Autorità centrale e autonomia locale</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel programma la Crisi di Norwich mette in luce il conflitto tra una comunità e l’autorità</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dell’Ufficio Generale nella gestione di incidenti legati alla Segretezza. Dopo mesi di</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">tensione fu raggiunto un compromesso. Non occorre aggiungere protagonisti, vittime o date</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">che il materiale non fornisce per comprenderne il problema istituzionale.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un incidente può richiedere rapidità locale e coordinamento più ampio. La difficoltà nasce</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">quando le parti non riconoscono gli stessi confini di competenza. La buona volontà non</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">sostituisce una risposta alla domanda su chi abbia titolo per decidere e a chi debba rendere</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">conto.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una crisi precedente a una riforma non ne dimostra da sola la causa. Lo storico deve cercare</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">un collegamento documentato tra difficoltà, discussioni e cambiamenti. Norwich permette</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">di distinguere difetti delle norme, mancanza di mezzi e problemi nell’applicazione, senza</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dichiararli equivalenti.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 7.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">53</text></svg>