<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Crisi e controversie</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">1871: i Calderoni; 1885: Greywick</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La crisi dei Calderoni del 1871 offre, nel programma, un riferimento al rapporto tra</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">produzione e affidabilità degli strumenti. Il materiale non fornisce una ricostruzione tecnica</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">completa: non si attribuiscono quindi al caso un difetto preciso, un numero di incidenti o</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">responsabilità personali non documentate.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il Caso Greywick del 1885 avvicina lo studio della responsabilità al presente. Permette di</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">discutere una controversia nella quale rischi e benefici della ricerca richiedono valutazione.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Anche qui il valore didattico non autorizza a inventare il contenuto di un esperimento o</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">l’esito di un giudizio.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Le discussioni possono usare esempi immaginari, purché restino distinguibili dagli eventi</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">del programma. Il sesto anno si conclude applicando lo stesso criterio alla storia economica</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">e scientifica: ricostruire ciò che era noto, le alternative considerate e i limiti delle prove</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">disponibili.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 12.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">87</text></svg>