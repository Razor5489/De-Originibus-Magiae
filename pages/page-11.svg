<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Prima di Hogwarts</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Comunità britanniche, consuetudini e accordi</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Prima delle grandi istituzioni la conoscenza circolava attraverso famiglie, maestri e piccole</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">comunità. Le tradizioni locali potevano custodire competenze importanti, ma l’accesso</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dipendeva dai rapporti personali. Due giovani della stessa età potevano ricevere</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">preparazioni molto diverse senza che questa differenza dimostrasse una diversa capacità di</text><text x="52" y="249" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">apprendere.</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel percorso britannico del programma, il Patto di Caer Daran del 382 rappresenta il</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">riconoscimento di obblighi comuni. Le Tavole di Morcant del 417 richiamano il passaggio</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dalla consuetudine alla conservazione scritta. Questi riferimenti mostrano esigenze</text><text x="52" y="333" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">differenti: stabilire un accordo e rendere trasmissibile una conoscenza.</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La Contesa dei Sette Pozzi, dal 463 al 474, ricorda che collaborazione e conflitto potevano</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">coesistere. L’assenza del Ministero non equivaleva all’assenza di regole. Significava</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">piuttosto che autorità, mezzi di controllo e accordi avevano un’organizzazione diversa da</text><text x="52" y="417" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">quella conosciuta nel 1890.</text><text x="52" y="447" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 2.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">11</text></svg>