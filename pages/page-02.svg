<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">PRAEFATIO</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il passato e le sue domande</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Prefazione di Theobald Ainsworth</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il passato non è soltanto un insieme di date. È la storia di persone che agirono senza</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">conoscere il seguito degli avvenimenti, di comunità che costruirono accordi e di istituzioni</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">che cambiarono insieme ai problemi affrontati.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Questo libro accompagna sette annualità. Per ciascuna, due settimane comprendono quattro</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">lezioni: due nella prima e due nella seconda. Ogni incontro unisce una spiegazione, alcune</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">nozioni centrali e un lavoro di confronto da svolgere in aula.</text><text x="52" y="316" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Due domande inseparabili</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Che cosa è accaduto? Su quali testimonianze possiamo sostenerlo? La prima domanda</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">costruisce una ricostruzione; la seconda permette di valutarla. Una risposta prudente non è</text><text x="52" y="376" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">una risposta debole quando rende visibili i propri limiti.</text><rect x="52" y="394" width="491" height="71" fill="#eee9d8"/><path d="M52 394v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="409" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">L’ORIZZONTE DEL VOLUME</text><text x="66" y="430" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Hogwarts, anno 1890. Gli avvenimenti successivi non fanno parte di queste pagine. Le</text><text x="66" y="446" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">vicende recenti restano aperte quando le fonti non permettono una conclusione.</text><text x="52" y="484" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Conservate le domande insieme agli appunti. Una buona lezione non riempie soltanto la memoria:</text><text x="52" y="502" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">insegna a riconoscere la differenza fra un fatto, un’interpretazione e un racconto.</text><text x="52" y="532" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#243b56" font-style="italic">Theobald Ainsworth</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">02</text></svg>