<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · LECTIO 1</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La Riforma Hawthorne · Scheda della lezione</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Perché avete iniziato Hogwarts a sedici anni, e non a un’altra età?</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">1. Confrontare due percorsi immaginari con risorse familiari diverse.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">2. Indicare un problema che la preparazione comune può affrontare e uno che può restare</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">aperto.</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">3. Collocare Petizione e Riforma come momenti diversi, senza inventare una data per la prima.</text><text x="52" y="350" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Domanda di ripasso</text><text x="52" y="374" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Una riforma che stabilisce basi comuni elimina da sola ogni disuguaglianza?</text><text x="52" y="410" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Risposta ragionata</text><text x="52" y="434" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">No. Riduce una frammentazione del programma, ma risorse, insegnanti e condizioni personali</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">possono continuare a differire.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">66</text></svg>