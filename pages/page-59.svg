<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La libertà della bacchetta</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La Carta del 1752 e i limiti del potere</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La Carta della Libertà della Bacchetta del 1752, richiamata dal programma, consente di</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">studiare il rapporto tra autonomia e sicurezza. La bacchetta è uno strumento con cui il mago</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">apprende, lavora e può difendersi. La sua sottrazione può quindi incidere su molti aspetti</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">della vita.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Lo stesso strumento può essere usato per danneggiare altri. Il problema storico non si</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">risolve dichiarando assoluta la libertà oppure sufficiente ogni richiamo alla sicurezza.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Bisogna comprendere chi possa limitare un diritto, per quali ragioni e con quali possibilità</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">di controllo.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il quarto anno si conclude collegando istituzioni e limiti. Una comunità deve poter</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">affrontare i pericoli senza rendere ogni decisione arbitraria. Il registro di un provvedimento</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">e la distinzione delle funzioni giudiziarie aiutano a porre domande precise sul potere, senza</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">inventare articoli della Carta non riportati dal programma.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 8.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">59</text></svg>