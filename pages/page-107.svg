<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">NOTA DELL’EDIZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">I materiali e il percorso</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Come sono state organizzate queste pagine</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Il programma principale</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Il «Programma storia della magia» guida temi, cronologia britannica e vicende contemporanee. I</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">quattordici nuclei del programma sono sviluppati in ventotto incontri: quattro per ciascuno dei sette</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">anni.</text><text x="52" y="281" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Gli approfondimenti antichi</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Il «Manuale di SDM – BWGDR» offre spunti su origini, civiltà antiche, trasmissione del sapere e</text><text x="52" y="323" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">tradizioni. Gli argomenti vengono selezionati e rielaborati secondo il percorso, senza estendere</text><text x="52" y="341" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">l’orizzonte oltre il 1890.</text><text x="52" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Le differenze fra i materiali</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Per la nascita del Ministero britannico viene adottato il 1708 del programma principale. Le date e le</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">istituzioni della cronologia seguono quel programma. Riferimenti appartenenti a tradizioni differenti</text><text x="52" y="438" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">non vengono sovrapposti come se fossero un’unica ricostruzione.</text><text x="52" y="475" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Documenti per imparare</text><text x="52" y="499" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">I fascicoli del 1732 e del 1874 e gli altri esempi dichiarati immaginari sono materiali di</text><text x="52" y="517" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">esercitazione. Non aggiungono avvenimenti alla storia della comunità.</text><text x="52" y="547" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#ac9258">Edizione di Theobald Ainsworth · Hogwarts · 1890</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">107</text></svg>