<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">LEXICON</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Le parole dello storico</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Un lessico da usare con precisione</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Fonte</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Testimonianza materiale, scritta o orale sulla quale si costruisce una ricerca.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Fatto e interpretazione</text><text x="52" y="267" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Un accadimento sostenuto dalle prove si distingue dalla spiegazione che ne viene proposta.</text><text x="52" y="302" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Tradizione</text><text x="52" y="326" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Racconto o pratica trasmessi nel tempo; da studiare nella loro conservazione e trasformazione.</text><text x="52" y="361" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Istituzione</text><text x="52" y="385" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Organizzazione di funzioni, regole e competenze riconosciute.</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Consuetudine</text><text x="52" y="444" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Pratica condivisa che può precedere o accompagnare una norma scritta.</text><text x="52" y="479" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Causalità</text><text x="52" y="503" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Rapporto da dimostrare tra fenomeni: non coincide con la semplice successione delle date.</text><text x="52" y="538" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Incertezza</text><text x="52" y="562" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Limite della ricostruzione da dichiarare; non autorizza a scegliere una spiegazione priva di prove.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">106</text></svg>