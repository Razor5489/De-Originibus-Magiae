<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La Preparazione Standard</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Dagli undici ai quindici anni, prima della pratica scolastica</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel percorso scolastico adottato, la Preparazione Standard riguarda gli anni dagli undici ai</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">quindici e ha carattere teorico. Si svolge senza bacchetta e senza pratica magica volontaria.</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">L’ingresso a sedici anni apre il successivo apprendimento scolastico guidato.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Conoscere un nome, comprendere un principio ed eseguire una formula non sono capacità</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">equivalenti. La formazione iniziale costruisce lessico, contesto e comprensione; non</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dimostra che l’allievo abbia già sperimentato volontariamente gli incantesimi. Una</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">manifestazione involontaria non costituisce un programma di esercitazione.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La storia della riforma aiuta a leggere il presente. Gli allievi possono aver ricevuto</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">spiegazioni differenti pur seguendo gli stessi riferimenti teorici. Il docente deve riconoscere</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">ciò che è stato compreso e ciò che richiede chiarimento, senza attribuire pratica precedente</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dove il percorso non la prevede.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 9; ordinamento scolastico Hawthorne adottato per il corso.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">67</text></svg>