<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Accuse e persecuzioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La testimonianza non coincide con il verdetto</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Diffidenza e paura possono trasformare una difficoltà comune in un’accusa. Nei materiali</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">sulle persecuzioni e sui processi, lo storico deve distinguere il fatto di essere accusati dalla</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dimostrazione di aver compiuto l’azione contestata. Una confessione o un verbale</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">richiedono attenzione alle condizioni in cui furono prodotti.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il manuale richiama la caccia alle streghe e i processi di Salem. Il loro studio non deve</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">confondere le credenze degli accusatori con una prova della natura magica degli imputati.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un testo persecutorio è importante per capire come veniva costruita l’accusa, non perché</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">renda vere tutte le sue affermazioni.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Le fonti possono anche raccontare la stessa vicenda da posizioni incompatibili. Occorre</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">cercare ciò che entrambe sostengono, ciò su cui divergono e i dettagli che ciascuna può</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">effettivamente conoscere. Comprendere una paura collettiva non significa condividere il</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">giudizio che ne derivò.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 5; Manuale, III–IV anno, processi e Salem.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">39</text></svg>