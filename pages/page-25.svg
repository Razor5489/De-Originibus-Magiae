<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Eroi e racconti contrapposti</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Morgana e la costruzione di una reputazione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel manuale Merlino e Morgana sono raccontati attraverso tradizioni che ne</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">contrappongono spesso i ruoli. Questo contrasto offre un caso di studio: una narrazione può</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rendere comprensibile uno scontro distribuendo le parti dell’eroe e dell’avversario. La</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">chiarezza del racconto non garantisce però una ricostruzione completa.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Per valutare una reputazione bisogna chiedersi chi narri, a chi si rivolga e quale qualità</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">desideri esaltare o condannare. Due racconti possono descrivere lo stesso gesto come</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">fedeltà oppure ostinazione. Il cambiamento di giudizio non dimostra, da solo, che uno dei</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">narratori possieda tutte le informazioni.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Le narrazioni antiche, comprese quelle greche e romane richiamate dal manuale, aiutano a</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">riconoscere questo problema. Lo storico studia il linguaggio dei racconti senza ricavare da</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">ogni episodio una capacità magica accertata. Nomi, simboli e valori possono sopravvivere</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">più a lungo delle prove sugli eventi.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 3; Manuale, II e IV anno; confronto didattico originale.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">25</text></svg>