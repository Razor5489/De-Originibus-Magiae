<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La rappresentanza del 1819</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Governare e ricevere un mandato</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il Decreto di Rappresentanza del 1819, nel programma, costituisce un passaggio nello</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">sviluppo della partecipazione politica britannica. Il suo studio collega diritto di voto,</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">elezione del Ministro e ruolo dei cittadini, distinguendoli dalla semplice esistenza di</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">un’autorità centrale.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un governante può prendere decisioni competenti senza essere stato scelto da tutte le</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">persone che ne subiscono le conseguenze. La rappresentanza riguarda anche il modo in cui</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">il potere viene formato. Il fatto che si svolga un’elezione non risponde da solo a tutte le</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">domande su accesso, libertà della scelta e condizioni del voto.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Lo storico deve conoscere le regole effettive, senza inventare requisiti non forniti dai</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">documenti. Il cittadino, a sua volta, ha bisogno di confrontare proposte e risultati. La</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">popolarità di un nome e il prestigio familiare non sostituiscono l’esame del programma di</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">governo.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 10.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">70</text></svg>