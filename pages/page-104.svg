<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CHRONOLOGIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Le date e i passaggi</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Dal programma adottato · Tavola I</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">382</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Patto di Caer Daran: obblighi comuni.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">417</text><text x="52" y="267" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Tavole di Morcant: conservazione scritta.</text><text x="52" y="302" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">463–474</text><text x="52" y="326" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Contesa dei Sette Pozzi.</text><text x="52" y="361" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Intorno al 990</text><text x="52" y="385" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Fondazione di Hogwarts.</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">1692</text><text x="52" y="444" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Statuto Internazionale di Segretezza.</text><text x="52" y="479" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">1708</text><text x="52" y="503" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Concordato di Westminster Magico: Ministero britannico.</text><text x="52" y="538" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">1752</text><text x="52" y="562" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Carta della Libertà della Bacchetta.</text><text x="52" y="597" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">1778</text><text x="52" y="621" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Riforma Hawthorne.</text><text x="52" y="656" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">1819</text><text x="52" y="680" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Decreto di Rappresentanza.</text><text x="52" y="708" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">Una cronologia ordina gli eventi. Il loro ordine non dimostra, da solo, il rapporto fra le cause.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">104</text></svg>