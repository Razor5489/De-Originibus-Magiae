<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Botteghe, imprese e lavoro</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Produrre di più, dipendere da altri</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">L’organizzazione della produzione modifica il rapporto tra chi costruisce, vende e utilizza</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">gli strumenti. Una bottega può conoscere direttamente i propri clienti; un’impresa più ampia</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">può raggiungere luoghi lontani, ma deve coordinare materiali, informazioni e controllo dei</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">prodotti.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La diffusione accresce opportunità e responsabilità. Se molti strumenti condividono lo</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">stesso difetto, un problema non resta confinato a un solo banco di lavoro. La reputazione</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">del produttore può orientare la fiducia, ma non sostituisce la verifica di ciò che viene</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">distribuito.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Per leggere la storia economica occorre ascoltare soggetti differenti: artigiani, lavoratori,</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">compratori e autorità. Una procedura considerata utile da un gruppo può essere percepita</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">come un costo da un altro. Capire questa differenza non significa attribuire</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">automaticamente ragione a tutte le parti.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 11.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">81</text></svg>