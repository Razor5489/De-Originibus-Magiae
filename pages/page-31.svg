<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Monumenti e tradizioni</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Che cosa dimostra un ricordo pubblico?</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un monumento può ricordare un’impresa senza provarne ogni dettaglio. La sua presenza</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">documenta almeno una scelta: qualcuno volle dedicare spazio, risorse e parole a una</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">determinata memoria. Questa scelta appartiene alla storia anche quando la vicenda celebrata</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rimane incerta.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La stessa distinzione vale per nomi, commemorazioni e tradizioni familiari. Il ricordo</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">pubblico seleziona: può mettere al centro un protagonista, dimenticare chi lo aiutò o</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">trasformare un episodio ambiguo in un esempio morale. Studiare ciò che viene ricordato</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">richiede anche di interrogare ciò che viene escluso.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il secondo anno si conclude senza scegliere tra credere a tutto e respingere tutte le leggende.</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il lavoro consiste nel formulare affermazioni commisurate alle prove. Si può ricostruire la</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">storia di una celebrazione anche quando non si possiede la certezza dell’evento celebrato.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezioni 3–4; sintesi didattica.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">31</text></svg>