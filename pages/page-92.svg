<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Chi scrive la storia?</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Autori, archivi e selezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La storia viene ricostruita attraverso testimonianze conservate in modo diseguale. Uffici,</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">famiglie e singoli individui non producono la stessa quantità di documenti e non possiedono</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">le stesse possibilità di conservarli. Un archivio ricco non contiene necessariamente tutte le</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">voci della comunità.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Chi scrive seleziona fatti e parole. Un documento può essere autentico e offrire una</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">prospettiva limitata. La domanda sull’autore riguarda competenze, posizione e possibilità di</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">osservazione; non permette di dichiarare falso un testo soltanto perché il suo autore aveva</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">un interesse.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Anche l’assenza richiede prudenza. Un’informazione può mancare perché non fu registrata,</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">perché andò perduta oppure perché non è accessibile. Non se ne ricava automaticamente</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">una censura. Il lavoro dello storico consiste nel rendere trasparenti le condizioni della</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">propria ricostruzione.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 13.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">92</text></svg>