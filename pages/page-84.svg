<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La ricerca responsabile</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La Carta del 1863</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La Carta della Ricerca Responsabile del 1863, nel programma, introduce il problema dei</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">limiti della sperimentazione. Una ricerca può perseguire un obiettivo utile e impiegare</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">mezzi inadeguati. La valutazione dello scopo deve quindi essere accompagnata dall’esame</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">delle condizioni di lavoro e delle conseguenze prevedibili.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La reputazione di uno studioso non sostituisce la documentazione. Per valutare una</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">proposta occorre conoscere quali prove siano state svolte, in quali condizioni e con quali</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">risultati, compresi quelli sfavorevoli. Una conclusione non diventa più solida eliminando</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dal resoconto ciò che non vi si adatta.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Ricercatori e autorità possiedono competenze differenti e possono avere interessi diversi. Il</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">problema non consiste nel scegliere in astratto tra libertà assoluta e divieto generale.</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Consiste nel comprendere come una comunità costruisca verifiche, responsabilità e limiti</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">riconoscibili.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 12.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">84</text></svg>