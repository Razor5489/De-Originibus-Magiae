<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Alaric Wren e l’ipotesi del 1883</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Descrivere una teoria senza trasformarla in certezza</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Alaric Wren nacque nel 1841 e studiò, secondo il programma, le descrizioni degli</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">incantesimi in fonti appartenenti a epoche diverse. Le variazioni osservate potevano</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dipendere da trascrizioni, interpretazioni o condizioni non ricostruite. Il confronto dei testi</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">apriva quindi domande, non una conclusione immediata.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel 1883 Wren propose che la magia potesse cambiare lentamente nel tempo. La comunità</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">accademica reagì in modi differenti: interesse per la domanda e obiezioni sulla sufficienza</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">delle prove. Il programma non presenta l’ipotesi come una legge dimostrata né come una</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">capacità speciale acquisibile dagli studenti.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una teoria non dimostrata non è automaticamente falsa; una teoria interessante non è</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">automaticamente vera. Lo storico deve descriverne contenuto, ricezione e limiti, senza</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">scegliere la conclusione in base alla simpatia per il ricercatore o al carattere suggestivo della</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">proposta.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 14.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">98</text></svg>