<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · LECTIO 4</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La libertà della bacchetta · Scheda della lezione</text><rect x="52" y="165" width="491" height="71" fill="#eee9d8"/><path d="M52 165v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Quali parti della vostra vita cambierebbero se non poteste più usare la bacchetta per un tempo</text><text x="66" y="217" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">indefinito?</text><text x="52" y="255" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">1. Presentare un villaggio immaginario nel quale un incidente susciti una richiesta di limitazioni</text><text x="52" y="272" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">generali.</text><text x="52" y="301" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">2. Far proporre una risposta motivata e un criterio per riesaminarla.</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">3. Collegare libertà, giustizia e registri, distinguendo la discussione dal testo storico della Carta.</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Domanda di ripasso</text><text x="52" y="390" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">La sicurezza rende automaticamente giustificata qualsiasi limitazione?</text><text x="52" y="426" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Risposta ragionata</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">No. Devono essere esaminate ragioni, competenze, estensione e controllo della decisione. Il</text><text x="52" y="466" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">richiamo a un obiettivo non dimostra l’adeguatezza di ogni mezzo.</text><text x="52" y="494" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#ac9258">Concluso il ciclo di due settimane. Si prosegue con l’anno V.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">61</text></svg>