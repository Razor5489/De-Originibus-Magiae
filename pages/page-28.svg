<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Quando nasce una leggenda</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Memoria, omissioni e trasformazioni</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Un racconto può cambiare anche quando nessuno intende mentire. Chi ascolta seleziona ciò</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">che considera importante; chi ricorda collega informazioni, tralascia dettagli o attribuisce</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">un’intenzione non dichiarata. La ripetizione attraverso generazioni può stabilizzare una</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">versione già modificata.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Questo processo non rende inutile la tradizione. La versione tardiva può conservare una</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">parte di un evento e aggiungere elementi che riflettono i bisogni di chi la tramanda. Lo</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">storico deve chiedersi quali parti siano sostenute da riscontri e quali appartengano alla</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">costruzione della memoria.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una testimonianza orale non è falsa soltanto perché non è scritta; una cronaca non è vera</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">soltanto perché usa un tono autorevole. Provenienza, distanza dagli eventi, possibilità di</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">verifica e dipendenza da altri racconti permettono una valutazione più precisa del semplice</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">confronto tra voce e pergamena.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 4.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">28</text></svg>