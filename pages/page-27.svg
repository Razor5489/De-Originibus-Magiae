<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · LECTIO 2</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Eroi e racconti contrapposti · Scheda della lezione</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Lo stesso gesto può apparire coraggioso a un narratore e imprudente a un altro?</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">1. Inventare un episodio ordinario con una decisione rischiosa e descriverlo da due punti di</text><text x="52" y="256" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">vista.</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">2. Sottolineare i fatti comuni alle due versioni e cerchiare gli aggettivi di giudizio.</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">3. Collegare l’esercizio alle figure di Merlino e Morgana, senza aggiungere eventi alla loro</text><text x="52" y="331" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">biografia.</text><text x="52" y="367" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Domanda di ripasso</text><text x="52" y="391" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Due giudizi opposti dimostrano necessariamente due avvenimenti diversi?</text><text x="52" y="427" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Risposta ragionata</text><text x="52" y="451" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">No. Possono essere interpretazioni differenti dello stesso gesto. Prima di scegliere un giudizio</text><text x="52" y="467" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">bisogna ricostruire le informazioni disponibili.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">27</text></svg>