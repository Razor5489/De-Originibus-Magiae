<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Dal Segreto al Ministero</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">1692–1708: coordinare una comunità</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Dopo lo Statuto fu necessario coordinare interventi su territori differenti. Nel programma la</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Commissione Britannica della Segretezza rappresenta uno degli strumenti di questa</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">riorganizzazione. Raccogliere notizie, prevenire incidenti e affrontare le violazioni erano</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">funzioni collegate, ma non identiche.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il primo censimento amministrativo rispondeva al bisogno di conoscere comunità e</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">popolazione. Le informazioni potevano sostenere servizi e comunicazioni; la loro</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">concentrazione poteva anche essere percepita come controllo. Lo storico non presume che</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">tutti gli abitanti interpretassero allo stesso modo il cambiamento.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Il Concordato di Westminster Magico del 1708 segnò, nella cronologia del programma, la</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">nascita formale del Ministero della Magia britannico. Tra Statuto e fondazione trascorsero</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">sedici anni. Il Ministero non inaugurò ogni regola della comunità: organizzò in una nuova</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">forma un processo già avviato.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 7; cronologia del programma prevalente sul Manuale.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">50</text></svg>