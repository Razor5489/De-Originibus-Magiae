="#293342">Dai Fondatori alle comunità antiche: comprendere come una conoscenza diventi patrimonio</text><text x="66" y="499" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">condiviso.</text><text x="52" y="537" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Le tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in</text><text x="52" y="555" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">aula.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">07</text></svg>