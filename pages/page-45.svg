<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Vivere dopo lo Statuto</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La legge nelle scelte quotidiane</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">L’effetto di una grande decisione si comprende anche nelle abitudini. Abitare vicino a</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">persone non magiche, lavorare, viaggiare e custodire oggetti richiedono scelte diverse</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">quando l’esposizione della magia diventa responsabilità verso l’intera comunità.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">I cambiamenti non furono necessariamente percepiti allo stesso modo da tutti. Una famiglia</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">già isolata poteva incontrare problemi differenti da chi intratteneva rapporti quotidiani con</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">vicini non magici. Una regola comune produce conseguenze concrete attraverso la</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">situazione di ciascuno.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Valutare la Segretezza richiede di distinguere obiettivo, mezzi e risultati. Proteggere</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">l’esistenza del mondo magico non significa aver eliminato ogni conflitto interno o garantito</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">l’uguaglianza. Il terzo anno si conclude seguendo il passaggio dalla decisione collettiva</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">all’esperienza individuale.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 6; applicazione didattica.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">45</text></svg>