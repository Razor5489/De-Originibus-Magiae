<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Maghi e Babbani</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La convivenza prima della Segretezza</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Prima dell’adozione della Segretezza, i rapporti tra popolazioni magiche e non magiche non</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">seguirono ovunque un solo modello. Prossimità, scambi, dipendenza reciproca e diffidenza</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">potevano trovarsi nello stesso territorio. Una distinzione netta nel 1890 non deve essere</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">proiettata automaticamente su ogni epoca precedente.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una comunità poteva conoscere una famiglia di maghi senza comprenderne le capacità. Un</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">aiuto poteva essere apprezzato in una circostanza e temuto in un’altra. La storia dei rapporti</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">richiede quindi attenzione alle situazioni concrete, invece di immaginare secoli di armonia</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">uniforme oppure un’ostilità senza interruzioni.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Lo storico confronta testimonianze di ambienti diversi e ne riconosce il punto di vista. Un</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">documento favorevole non cancella le persecuzioni; un episodio ostile non descrive ogni</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">relazione quotidiana. Capire questa varietà è necessario per studiare le trasformazioni che</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">portarono alla separazione istituzionale.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 5; Manuale, I e III anno, rapporti e Medioevo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">36</text></svg>