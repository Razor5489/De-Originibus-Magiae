<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · LECTIO 1</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Dal Segreto al Ministero · Scheda della lezione</text><rect x="52" y="165" width="491" height="71" fill="#eee9d8"/><path d="M52 165v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Una legge senza uffici, informazioni e responsabilità definite può funzionare nello stesso</text><text x="66" y="217" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">modo ovunque?</text><text x="52" y="255" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">1. Disegnare una linea del tempo con 1692 e 1708.</text><text x="52" y="284" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">2. Collocare nello spazio intermedio i problemi di coordinamento, senza attribuire date non</text><text x="52" y="301" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">fornite al censimento.</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">3. Progettare un ufficio con un compito preciso e un limite al suo potere.</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Domanda di ripasso</text><text x="52" y="390" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Perché il Ministero del 1708 non deve essere immaginato identico a quello del 1890?</text><text x="52" y="426" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Risposta ragionata</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Perché istituzioni, uffici e diritti continuano a trasformarsi. La fondazione non contiene</text><text x="52" y="466" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">automaticamente tutti gli sviluppi successivi.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">52</text></svg>