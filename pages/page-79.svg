<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · LECTIO 1</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Le nozioni da ricordare</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Il XIX secolo</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Innovazione</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">È una novità relativa a un contesto; la sua introduzione non coincide con una diffusione</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">universale.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Continuità e cambiamento</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una società può conservare tradizioni e modificare profondamente le proprie condizioni</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">materiali.</text><text x="52" y="342" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Accesso</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Disponibilità di un prodotto e possibilità concreta di procurarselo sono aspetti differenti.</text><rect x="52" y="384" width="491" height="71" fill="#eee9d8"/><path d="M52 384v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="399" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">DOMANDA DA DISCUTERE</text><text x="66" y="420" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Quale oggetto quotidiano vi sembra tanto normale da farvi dimenticare che qualcuno ha</text><text x="66" y="436" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">dovuto introdurlo?</text><text x="52" y="474" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">Per motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione</text><text x="52" y="492" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76">ragionata può essere discussa; una notizia nuova richiede una fonte.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">79</text></svg>