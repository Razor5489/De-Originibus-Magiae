<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Giustizia e registri</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Accusare, verificare, giudicare</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La costruzione di istituzioni comuni riguarda anche il giudizio sulle controversie. Nel</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">programma l’Ufficio di Giustizia Magica richiama la gestione amministrativa e operativa</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">delle procedure, mentre l’Alta Corte della Comunità permette di affrontare il problema della</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">valutazione delle accuse.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Chi formula un’accusa, chi raccoglie gli elementi e chi giudica svolgono funzioni diverse.</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La provenienza autorevole di un’affermazione non sostituisce l’esame delle prove. La</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">presenza di un tribunale non garantisce l’assenza di errori, ma una procedura riconoscibile</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rende possibile chiedere come si sia arrivati a una decisione.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">I registri conservano tracce di ordini, motivazioni e responsabilità. Possono permettere di</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">ricostruire una scelta anche dopo la scomparsa dei suoi autori. Tuttavia, la registrazione non</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rende giusto ogni provvedimento: anche il documento amministrativo può contenere errori</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">e omissioni.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 8.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">56</text></svg>