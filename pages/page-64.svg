<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">La Riforma Hawthorne</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">1778: rendere condivise le basi</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La fondazione di una scuola non eliminò subito le differenze nella formazione iniziale.</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Famiglie, precettori e comunità continuarono a offrire opportunità diseguali. Il possesso di</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">libri e la disponibilità di un maestro potevano cambiare ciò che un giovane aveva studiato</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">prima di arrivare a Hogwarts.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La Petizione dei Precettori si inserisce nel percorso che portò a discutere questa</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">frammentazione. Anche insegnanti preparati potevano seguire criteri molto diversi. Una</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">base comune cercava di rendere riconoscibili gli obiettivi, senza confondere le opportunità</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">ricevute con l’intelligenza dell’allievo.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel 1778 la Riforma Hawthorne organizzò il percorso educativo intorno alla Preparazione</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Standard e all’ingresso a Hogwarts a sedici anni. Il sistema ha quindi una storia: non deriva</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">da un’età imposta dalla natura della magia. La riforma affronta un problema preciso, senza</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">garantire che ogni disuguaglianza scompaia.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 9.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">64</text></svg>