<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · LECTIO 4</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il confronto in aula</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Custodire e trasmettere · Scheda della lezione</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">APERTURA</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">È più importante possedere un libro oppure sapere chi può leggerlo e comprenderlo?</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">1. Confrontare tre modelli: apprendimento familiare, maestro locale e scuola comune.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">2. Per ciascuno indicare un vantaggio e una possibile difficoltà nella trasmissione.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">3. Riprendere i Fondatori e spiegare quale problema istituzionale affronti la nascita di una</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">scuola.</text><text x="52" y="350" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Domanda di ripasso</text><text x="52" y="374" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Una scuola rende subito identica la preparazione di tutti gli studenti?</text><text x="52" y="410" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Risposta ragionata</text><text x="52" y="434" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">No. Crea una struttura comune, ma restano differenze di accesso, insegnamento e comprensione. Le</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">successive riforme educative nasceranno anche da questi problemi.</text><text x="52" y="478" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#ac9258">Concluso il ciclo di due settimane. Si prosegue con l’anno II.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">19</text></svg>