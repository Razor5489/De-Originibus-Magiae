<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">METHODUS</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Come si legge una fonte</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Il metodo che accompagna tutte le annualità</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Identificare</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Chi ha prodotto la testimonianza, quando e per quale destinatario? Un’informazione sulla</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">provenienza aiuta a comprendere il punto di vista.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Descrivere</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Che cosa afferma davvero il testo o che cosa mostra il reperto? Prima dell’interpretazione,</text><text x="52" y="302" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">distinguere gli elementi osservabili.</text><text x="52" y="338" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Confrontare</text><text x="52" y="362" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Quali altre fonti offrono riscontri? Due testi dipendenti dalla stessa notizia non sono</text><text x="52" y="379" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">necessariamente due conferme autonome.</text><text x="52" y="415" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Concludere con misura</text><text x="52" y="439" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">Separare ciò che è sostenuto dalle prove, ciò che rimane un’ipotesi e ciò che non sappiamo. Un</text><text x="52" y="456" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#293342">limite dichiarato rende controllabile il ragionamento.</text><rect x="52" y="473" width="491" height="71" fill="#eee9d8"/><path d="M52 473v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="488" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">AUTENTICO NON SIGNIFICA INFALLIBILE</text><text x="66" y="509" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Un documento può essere realmente opera del suo autore e contenere errori, opinioni o</text><text x="66" y="525" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">informazioni incomplete.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">05</text></svg>