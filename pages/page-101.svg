<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · SPIEGAZIONE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il Caso Wren</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">1887–1890: scrivere una storia ancora aperta</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">L’ultima presenza confermata di Alaric Wren risale al 14 novembre 1887. Il 3 dicembre</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">dello stesso anno venne aperto formalmente il caso sulla sua scomparsa. Le autorità</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">acquisirono parte della documentazione di ricerca, ma le informazioni riportate nel</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">programma non consentono di stabilirne la sorte.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La successione fra controversia accademica e scomparsa non dimostra un rapporto causale.</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Allontanamento volontario, incidente o intervento altrui restano possibilità non accertate;</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">non costituiscono conclusioni equivalenti a un fatto. L’acquisizione di documenti non ne</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">rivela automaticamente contenuto e rilevanza.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Nel 1890 si può studiare il caso dichiarando ciò che è disponibile e ciò che rimane ignoto.</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Una ricostruzione parziale ma trasparente vale più di una spiegazione completa inventata. Il</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">percorso dei sette anni termina qui: comprendere il passato significa anche riconoscere</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">quando le fonti non permettono di chiudere una domanda.</text><text x="52" y="429" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Programma, lezione 14; orizzonte del volume: 1890.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">101</text></svg>