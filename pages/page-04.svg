<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#111f34"/><stop offset=".12" stop-color="#294260"/><stop offset=".6" stop-color="#1b304a"/><stop offset="1" stop-color="#101d30"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">DE ORIGINIBUS MAGIAE</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CURSUS SEPTEM ANNORUM</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#243b56" font-weight="bold">Il percorso delle due settimane</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Quattro incontri prima del passaggio all’anno successivo</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Settimana I</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Lezione 1: introdurre il tema e riconoscere il problema storico. Lezione 2: sviluppare il</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">confronto attraverso un caso o una prospettiva differente.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Settimana II</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">Lezione 3: collegare gli argomenti a documenti, istituzioni e nozioni. Lezione 4: applicare il</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">metodo e raccogliere il ripasso dell’annualità.</text><rect x="52" y="323" width="491" height="71" fill="#eee9d8"/><path d="M52 323v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="338" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#243b56" font-weight="bold">UNA LEZIONE DI QUINDICI MINUTI</text><text x="66" y="359" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">2 minuti: domanda iniziale. 5: spiegazione e nozioni. 5: confronto o attività. 3: domanda</text><text x="66" y="375" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">conclusiva e motivazione della risposta.</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#243b56" font-weight="bold">Tre pagine, un solo incontro</text><text x="52" y="444" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">La pagina di spiegazione, quella delle nozioni e la scheda per l’aula appartengono alla</text><text x="52" y="462" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#293342">stessa lezione. Il numero delle pagine non aggiunge incontri al calendario.</text><text x="52" y="492" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">Gli appunti permettono di riprendere i temi delle lezioni. Recuperi e verifiche seguono le</text><text x="52" y="510" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#293342">disposizioni della scuola.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">HISTORIA MAGIAE · HOGWARTS · MDCCCXC</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">04</text></svg>