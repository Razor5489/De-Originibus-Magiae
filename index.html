\nRiferimento: Programma, lezione 12.","title":"Crisi e controversie","folio":"87","kind":"theory"},{"image":"pages/page-88.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 4\nLe nozioni da ricordare\nCrisi e controversie\nInformazione incompleta\nUn nome e una data possono essere certi nel programma senza rendere noti tutti i dettagli della vicenda.\nGiudizio retrospettivo\nConoscere un esito non significa che i protagonisti potessero prevederlo con le stesse informazioni.\nEsempio e avvenimento\nUn calderone difettoso descritto in aula può illustrare un problema senza ricostruire la crisi del 1871.\nDomanda da discutere\nQuando emergono segnalazioni contrastanti, è sufficiente difendere la reputazione di chi produce o ricerca?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Crisi e controversie · Nozioni","folio":"88","kind":"theory"},{"image":"pages/page-89.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 4\nIl confronto in aula\nCrisi e controversie · Scheda della lezione\nApertura\nQuando emergono segnalazioni contrastanti, è sufficiente difendere la reputazione di chi produce o ricerca?\n1. Presentare un caso immaginario di segnalazioni su uno strumento e distinguere osservazioni da ipotesi di causa.\n2. Chiedere quali verifiche servano e quali decisioni richiedano ancora informazioni.\n3. Confrontare il ragionamento con 1871 e 1885, dichiarando i particolari che il programma non fornisce.\nDomanda di ripasso\nUn buon esempio didattico diventa automaticamente una fonte sul caso storico?\nRisposta ragionata\nNo. Aiuta a ragionare, ma non aggiunge fatti all’avvenimento. Occorre mantenere riconoscibile la sua natura immaginaria.\nConcluso il ciclo di due settimane. Si prosegue con l’anno VII.","title":"Crisi e controversie · Attività e ripasso","folio":"89","kind":"theory"},{"image":"pages/page-90.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII\nStoria, verità e memoria\nAnnus Septimus\nConfrontare documenti e ricostruire il passato dichiarando prove, ipotesi e limiti.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Storia, verità e memoria","folio":"90","kind":"divider"},{"image":"pages/page-91.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Chi scrive la storia? 92\nAutori, archivi e selezione\nLezione 2 · Il laboratorio degli archivisti 95\nConfrontare documenti senza inventare una soluzione\nSettimana II\nLezione 3 · Alaric Wren e l’ipotesi del 1883 98\nDescrivere una teoria senza trasformarla in certezza\nLezione 4 · Il Caso Wren 101\n1887–1890: scrivere una storia ancora aperta\nTraguardo\nConfrontare documenti e ricostruire il passato dichiarando prove, ipotesi e limiti.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"91","kind":"theory"},{"image":"pages/page-92.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Settimana I\nChi scrive la storia?\nAutori, archivi e selezione\nLa storia viene ricostruita attraverso testimonianze conservate in modo diseguale. Uffici, famiglie e singoli individui non producono la stessa quantità di documenti e non possiedono le stesse possibilità di conservarli. Un archivio ricco non contiene necessariamente tutte le voci della comunità.\nChi scrive seleziona fatti e parole. Un documento può essere autentico e offrire una prospettiva limitata. La domanda sull’autore riguarda competenze, posizione e possibilità di osservazione; non permette di dichiarare falso un testo soltanto perché il suo autore aveva un interesse.\nAnche l’assenza richiede prudenza. Un’informazione può mancare perché non fu registrata, perché andò perduta oppure perché non è accessibile. Non se ne ricava automaticamente una censura. Il lavoro dello storico consiste nel rendere trasparenti le condizioni della propria ricostruzione.\nRiferimento: Programma, lezione 13.","title":"Chi scrive la storia?","folio":"92","kind":"theory"},{"image":"pages/page-93.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 1\nLe nozioni da ricordare\nChi scrive la storia?\nAutore e destinatario\nSapere chi scrive e per chi aiuta a comprendere scelte e linguaggio del documento.\nSilenzio della fonte\nNon tutti i documenti sono destinati a registrare ogni aspetto di un evento.\nRiscontro indipendente\nDue testi che copiano la stessa notizia non equivalgono necessariamente a due testimonianze autonome.\nDomanda da discutere\nUn archivio che conserva soprattutto le decisioni dei funzionari racconta allo stesso modo la vita di tutti?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Chi scrive la storia? · Nozioni","folio":"93","kind":"theory"},{"image":"pages/page-94.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 1\nIl confronto in aula\nChi scrive la storia? · Scheda della lezione\nApertura\nUn archivio che conserva soprattutto le decisioni dei funzionari racconta allo stesso modo la vita di tutti?\n1. Scegliere una decisione scolastica immaginaria e indicare tre possibili documenti prodotti da persone diverse.\n2. Descrivere che cosa ciascun autore potrebbe conoscere direttamente.\n3. Elencare una conclusione sostenibile e una che richiederebbe altre fonti.\nDomanda di ripasso\nUna fonte interessata deve essere sempre scartata?\nRisposta ragionata\nNo. Il suo interesse va riconosciuto e confrontato con il contenuto e con altri riscontri. Non rende automaticamente falsa ogni informazione.","title":"Chi scrive la storia? · Attività e ripasso","folio":"94","kind":"theory"},{"image":"pages/page-95.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Settimana I\nIl laboratorio degli archivisti\nConfrontare documenti senza inventare una soluzione\nPer un esercizio si possono predisporre fonti di provenienza assunta come autentica. Questa convenzione non rende vere tutte le informazioni contenute. Il confronto serve a distinguere ciò che un documento afferma, ciò che permette di concludere e ciò che il lettore vi aggiunge.\nNel fascicolo didattico del programma, un registro del 1732 descrive la continuità generale delle lezioni; una lettera menziona alcuni corridoi chiusi. Le due informazioni non sono necessariamente incompatibili. La chiusura locale può coesistere con un’attività scolastica regolare, senza che questo riveli il motivo della chiusura.\nUn secondo gruppo di documenti immaginari, datati 1874 per l’esercizio, riguarda una proposta sulle botteghe. Un articolo descrive opinioni contrarie, un ufficio segnala una valutazione in corso e una testimonianza privata riferisce timori familiari. Nessuna di queste notizie dimostra da sola che la proposta sia stata approvata o che abbia prodotto gli effetti temuti.\nRiferimento: Programma, lezione 13, fascicolo didattico; riassunti rielaborati.","title":"Il laboratorio degli archivisti","folio":"95","kind":"theory"},{"image":"pages/page-96.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 2\nLe nozioni da ricordare\nIl laboratorio degli archivisti\nFascicolo di esercitazione\nLe date 1732 e 1874 identificano materiali didattici immaginari, non nuovi avvenimenti ufficiali.\nApparente contraddizione\nDue fonti possono descrivere livelli diversi della stessa situazione.\nProposta e decisione\nIl dibattito su un provvedimento non prova la sua approvazione.\nDomanda da discutere\nLezioni regolari e corridoi chiusi possono essere descrizioni entrambe corrette?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Il laboratorio degli archivisti · Nozioni","folio":"96","kind":"theory"},{"image":"pages/page-97.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 2\nIl confronto in aula\nIl laboratorio degli archivisti · Scheda della lezione\nApertura\nLezioni regolari e corridoi chiusi possono essere descrizioni entrambe corrette?\n1. Dividere la classe tra i fascicoli 1732 e 1874, usando i riassunti della pagina come documenti di esercitazione.\n2. Per ciascun gruppo compilare tre colonne: affermato, deducibile, ignoto.\n3. Confrontare i risultati senza cercare una causa segreta o un esito non fornito.\nDomanda di ripasso\nL’autenticità convenzionale della provenienza rende infallibile il contenuto?\nRisposta ragionata\nNo. Anche nell’esercizio, provenienza e attendibilità delle singole affermazioni devono essere distinte.","title":"Il laboratorio degli archivisti · Attività e ripasso","folio":"97","kind":"theory"},{"image":"pages/page-98.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Settimana II\nAlaric Wren e l’ipotesi del 1883\nDescrivere una teoria senza trasformarla in certezza\nAlaric Wren nacque nel 1841 e studiò, secondo il programma, le descrizioni degli incantesimi in fonti appartenenti a epoche diverse. Le variazioni osservate potevano dipendere da trascrizioni, interpretazioni o condizioni non ricostruite. Il confronto dei testi apriva quindi domande, non una conclusione immediata.\nNel 1883 Wren propose che la magia potesse cambiare lentamente nel tempo. La comunità accademica reagì in modi differenti: interesse per la domanda e obiezioni sulla sufficienza delle prove. Il programma non presenta l’ipotesi come una legge dimostrata né come una capacità speciale acquisibile dagli studenti.\nUna teoria non dimostrata non è automaticamente falsa; una teoria interessante non è automaticamente vera. Lo storico deve descriverne contenuto, ricezione e limiti, senza scegliere la conclusione in base alla simpatia per il ricercatore o al carattere suggestivo della proposta.\nRiferimento: Programma, lezione 14.","title":"Alaric Wren e l’ipotesi del 1883","folio":"98","kind":"theory"},{"image":"pages/page-99.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 3\nLe nozioni da ricordare\nAlaric Wren e l’ipotesi del 1883\nVariazione dei testi\nDescrizioni diverse non identificano da sole la causa della differenza.\nIpotesi\nÈ una spiegazione da mettere alla prova, distinta da un risultato già accertato.\nRicezione\nLe reazioni degli studiosi fanno parte della storia della proposta, senza sostituire l’esame delle prove.\nDomanda da discutere\nDue testi che descrivono diversamente un effetto dimostrano già che sia cambiata la magia?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Alaric Wren e l’ipotesi del 1883 · Nozioni","folio":"99","kind":"theory"},{"image":"pages/page-100.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 3\nIl confronto in aula\nAlaric Wren e l’ipotesi del 1883 · Scheda della lezione\nApertura\nDue testi che descrivono diversamente un effetto dimostrano già che sia cambiata la magia?\n1. Elencare tre spiegazioni possibili per una differenza tra descrizioni antiche e recenti.\n2. Scrivere la proposta del 1883 come ipotesi attribuita a Wren.\n3. Separare il contenuto della teoria dal giudizio che se ne può dare con i materiali disponibili.\nDomanda di ripasso\nUna spiegazione non dimostrata deve essere considerata subito falsa?\nRisposta ragionata\nNo. Può rimanere aperta alla ricerca. Questo non autorizza a presentarla come conoscenza dimostrata.","title":"Alaric Wren e l’ipotesi del 1883 · Attività e ripasso","folio":"100","kind":"theory"},{"image":"pages/page-101.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Settimana II\nIl Caso Wren\n1887–1890: scrivere una storia ancora aperta\nL’ultima presenza confermata di Alaric Wren risale al 14 novembre 1887. Il 3 dicembre dello stesso anno venne aperto formalmente il caso sulla sua scomparsa. Le autorità acquisirono parte della documentazione di ricerca, ma le informazioni riportate nel programma non consentono di stabilirne la sorte.\nLa successione fra controversia accademica e scomparsa non dimostra un rapporto causale. Allontanamento volontario, incidente o intervento altrui restano possibilità non accertate; non costituiscono conclusioni equivalenti a un fatto. L’acquisizione di documenti non ne rivela automaticamente contenuto e rilevanza.\nNel 1890 si può studiare il caso dichiarando ciò che è disponibile e ciò che rimane ignoto. Una ricostruzione parziale ma trasparente vale più di una spiegazione completa inventata. Il percorso dei sette anni termina qui: comprendere il passato significa anche riconoscere quando le fonti non permettono di chiudere una domanda.\nRiferimento: Programma, lezione 14; orizzonte del volume: 1890.","title":"Il Caso Wren","folio":"101","kind":"theory"},{"image":"pages/page-102.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 4\nLe nozioni da ricordare\nIl Caso Wren\nCronologia certa del programma\n14 novembre: ultima presenza confermata; 3 dicembre: apertura formale. Sono eventi diversi.\nFonte non consultabile\nUn documento può esistere senza essere accessibile; la limitazione non dimostra da sola un occultamento.\nConclusione aperta\nDichiarare l’incertezza non impedisce di ricostruire la parte documentata di una vicenda.\nDomanda da discutere\nSi può scrivere una pagina di storia senza conoscere la soluzione finale del caso?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Il Caso Wren · Nozioni","folio":"102","kind":"theory"},{"image":"pages/page-103.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VII · Lectio 4\nIl confronto in aula\nIl Caso Wren · Scheda della lezione\nApertura\nSi può scrivere una pagina di storia senza conoscere la soluzione finale del caso?\n1. Redigere un resoconto breve con le due date del 1887 e la situazione delle prove.\n2. Eliminare ogni frase che presenti una causa non dimostrata come certa.\n3. Concludere con una domanda aperta e una fonte che sarebbe utile consultare, senza inventarne il contenuto.\nDomanda di ripasso\nLa teoria controversa e la scomparsa dimostrano che Wren fu fatto tacere?\nRisposta ragionata\nNo. Il collegamento causale richiederebbe prove ulteriori. I fatti disponibili consentono una cronologia prudente, non una soluzione della scomparsa.\nConcluso il ciclo di due settimane. Il percorso dei sette anni è concluso.","title":"Il Caso Wren · Attività e ripasso","folio":"103","kind":"theory"},{"image":"pages/page-104.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nChronologia\nLe date e i passaggi\nDal programma adottato · Tavola I\n382\nPatto di Caer Daran: obblighi comuni.\n417\nTavole di Morcant: conservazione scritta.\n463–474\nContesa dei Sette Pozzi.\nIntorno al 990\nFondazione di Hogwarts.\n1692\nStatuto Internazionale di Segretezza.\n1708\nConcordato di Westminster Magico: Ministero britannico.\n1752\nCarta della Libertà della Bacchetta.\n1778\nRiforma Hawthorne.\n1819\nDecreto di Rappresentanza.\nUna cronologia ordina gli eventi. Il loro ordine non dimostra, da solo, il rapporto fra le cause.","title":"Le date e i passaggi","folio":"104","kind":"theory"},{"image":"pages/page-105.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nChronologia\nLe date e i passaggi\nDal programma adottato · Tavola II\n1824\nDimissioni di Lucien Barrow.\n1841\nNascita di Alaric Wren.\n1863\nCarta della Ricerca Responsabile.\n1871\nCrisi dei Calderoni.\n1883\nWren propone l’ipotesi del lento mutamento della magia.\n1885\nCaso Greywick.\n14 novembre 1887\nUltima presenza confermata di Wren.\n3 dicembre 1887\nApertura formale del Caso Wren.\n1890\nOrizzonte presente del volume: il caso resta irrisolto.\nUna cronologia ordina gli eventi. Il loro ordine non dimostra, da solo, il rapporto fra le cause.","title":"Le date e i passaggi","folio":"105","kind":"theory"},{"image":"pages/page-106.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nLexicon\nLe parole dello storico\nUn lessico da usare con precisione\nFonte\nTestimonianza materiale, scritta o orale sulla quale si costruisce una ricerca.\nFatto e interpretazione\nUn accadimento sostenuto dalle prove si distingue dalla spiegazione che ne viene proposta.\nTradizione\nRacconto o pratica trasmessi nel tempo; da studiare nella loro conservazione e trasformazione.\nIstituzione\nOrganizzazione di funzioni, regole e competenze riconosciute.\nConsuetudine\nPratica condivisa che può precedere o accompagnare una norma scritta.\nCausalità\nRapporto da dimostrare tra fenomeni: non coincide con la semplice successione delle date.\nIncertezza\nLimite della ricostruzione da dichiarare; non autorizza a scegliere una spiegazione priva di prove.","title":"Le parole dello storico","folio":"106","kind":"theory"},{"image":"pages/page-107.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nNota dell’edizione\nI materiali e il percorso\nCome sono state organizzate queste pagine\nIl programma principale\nIl «Programma storia della magia» guida temi, cronologia britannica e vicende contemporanee. I quattordici nuclei del programma sono sviluppati in ventotto incontri: quattro per ciascuno dei sette anni.\nGli approfondimenti antichi\nIl «Manuale di SDM – BWGDR» offre spunti su origini, civiltà antiche, trasmissione del sapere e tradizioni. Gli argomenti vengono selezionati e rielaborati secondo il percorso, senza estendere l’orizzonte oltre il 1890.\nLe differenze fra i materiali\nPer la nascita del Ministero britannico viene adottato il 1708 del programma principale. Le date e le istituzioni della cronologia seguono quel programma. Riferimenti appartenenti a tradizioni differenti non vengono sovrapposti come se fossero un’unica ricostruzione.\nDocumenti per imparare\nI fascicoli del 1732 e del 1874 e gli altri esempi dichiarati immaginari sono materiali di esercitazione. Non aggiungono avvenimenti alla storia della comunità.\nEdizione di Theobald Ainsworth · Hogwarts · 1890","title":"I materiali e il percorso","folio":"107","kind":"theory"},{"image":"pages/page-108.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nFinis\nRicordare è un inizio.\nComprendere è il compito.\nSette annualità. Quattordici settimane. Ventotto lezioni per collegare origini, istituzioni e responsabilità della memoria.\nTheobald Ainsworth\nHogwarts · MDCCCXC","title":"Ricordare è un inizio.","folio":"108","kind":"theory"},{"image":"pages/page-109.svg?v=20261121-1","text":"Controguardia posteriore marmorizzata.","title":"Controguardia posteriore","folio":"Controguardia","kind":"endpaper"},{"image":"pages/page-110.svg?v=20261121-cover2","text":"DE ORIGINIBUS MAGIAE\nTheobald Ainsworth\nHogwarts · 1890\nCronache, istituzioni e memoria","title":"Quarta di copertina","folio":"Quarta di copertina","kind":"cover"}],"chapters":[{"title":"Copertina","page":1},{"title":"Prefazione","page":2},{"title":"Indice del volume","page":3},{"title":"Il percorso delle due settimane","page":4},{"title":"Il metodo dello storico","page":5},{"title":"Anno I · Le origini","page":6},{"title":"I.1 · I Quattro Fondatori","page":8},{"title":"I.2 · Prima di Hogwarts","page":11},{"title":"I.3 · Le tracce della magia antica","page":14},{"title":"I.4 · Custodire e trasmettere","page":17},{"title":"Anno II · Persone, racconti e leggende","page":20},{"title":"II.1 · Merlino, tra uomo e memoria","page":22},{"title":"II.2 · Eroi e racconti contrapposti","page":25},{"title":"II.3 · Quando nasce una leggenda","page":28},{"title":"II.4 · Monumenti e tradizioni","page":31},{"title":"Anno III · Maghi e Babbani","page":34},{"title":"III.1 · Maghi e Babbani","page":36},{"title":"III.2 · Accuse e persecuzioni","page":39},{"title":"III.3 · Lo St
