<script id="book-data" type="application/json">{"pages":[{"image":"pages/page-01.svg?v=20261121-cover2","text":"DE ORIGINIBUS MAGIAE\nTheobald Ainsworth\nHogwarts · 1890\nCronache, istituzioni e memoria","title":"Copertina","folio":"Copertina","kind":"cover"},{"image":"pages/page-02.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nPraefatio\nIl passato e le sue domande\nPrefazione di Theobald Ainsworth\nIl passato non è soltanto un insieme di date. È la storia di persone che agirono senza conoscere il seguito degli avvenimenti, di comunità che costruirono accordi e di istituzioni che cambiarono insieme ai problemi affrontati.\nQuesto libro accompagna sette annualità. Per ciascuna, due settimane comprendono quattro lezioni: due nella prima e due nella seconda. Ogni incontro unisce una spiegazione, alcune nozioni centrali e un lavoro di confronto da svolgere in aula.\nDue domande inseparabili\nChe cosa è accaduto? Su quali testimonianze possiamo sostenerlo? La prima domanda costruisce una ricostruzione; la seconda permette di valutarla. Una risposta prudente non è una risposta debole quando rende visibili i propri limiti.\nL’orizzonte del volume\nHogwarts, anno 1890. Gli avvenimenti successivi non fanno parte di queste pagine. Le vicende recenti restano aperte quando le fonti non permettono una conclusione.\nConservate le domande insieme agli appunti. Una buona lezione non riempie soltanto la memoria: insegna a riconoscere la differenza fra un fatto, un’interpretazione e un racconto.\nTheobald Ainsworth","title":"Il passato e le sue domande","folio":"02","kind":"theory"},{"image":"pages/page-03.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nTabula Materiarum\nIndice del volume\nSette annualità · Ventotto lezioni\nPrefazione 2\nIl percorso delle due settimane 4\nIl metodo dello storico 5\nAnno I · Le origini 6\nAnno II · Persone, racconti e leggende 20\nAnno III · Maghi e Babbani 34\nAnno IV · La Gran Bretagna magica 48\nAnno V · Istruzione e cittadinanza 62\nAnno VI · Il secolo del cambiamento 76\nAnno VII · Storia, verità e memoria 90\nCronologia · I 104\nCronologia · II 105\nLessico essenziale 106\nI materiali del volume 107\nFinis 108\nL’indice ricercabile permette di trovare una singola lezione, un nome o una data. Le linguette laterali aprono le annualità e le tavole finali.","title":"Indice del volume","folio":"03","kind":"theory"},{"image":"pages/page-04.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nCursus Septem Annorum\nIl percorso delle due settimane\nQuattro incontri prima del passaggio all’anno successivo\nSettimana I\nLezione 1: introdurre il tema e riconoscere il problema storico. Lezione 2: sviluppare il confronto attraverso un caso o una prospettiva differente.\nSettimana II\nLezione 3: collegare gli argomenti a documenti, istituzioni e nozioni. Lezione 4: applicare il metodo e raccogliere il ripasso dell’annualità.\nUna lezione di quindici minuti\n2 minuti: domanda iniziale. 5: spiegazione e nozioni. 5: confronto o attività. 3: domanda conclusiva e motivazione della risposta.\nTre pagine, un solo incontro\nLa pagina di spiegazione, quella delle nozioni e la scheda per l’aula appartengono alla stessa lezione. Il numero delle pagine non aggiunge incontri al calendario.\nGli appunti permettono di riprendere i temi delle lezioni. Recuperi e verifiche seguono le disposizioni della scuola.","title":"Il percorso delle due settimane","folio":"04","kind":"theory"},{"image":"pages/page-05.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nMethodus\nCome si legge una fonte\nIl metodo che accompagna tutte le annualità\nIdentificare\nChi ha prodotto la testimonianza, quando e per quale destinatario? Un’informazione sulla provenienza aiuta a comprendere il punto di vista.\nDescrivere\nChe cosa afferma davvero il testo o che cosa mostra il reperto? Prima dell’interpretazione, distinguere gli elementi osservabili.\nConfrontare\nQuali altre fonti offrono riscontri? Due testi dipendenti dalla stessa notizia non sono necessariamente due conferme autonome.\nConcludere con misura\nSeparare ciò che è sostenuto dalle prove, ciò che rimane un’ipotesi e ciò che non sappiamo. Un limite dichiarato rende controllabile il ragionamento.\nAutentico non significa infallibile\nUn documento può essere realmente opera del suo autore e contenere errori, opinioni o informazioni incomplete.","title":"Come si legge una fonte","folio":"05","kind":"theory"},{"image":"pages/page-06.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I\nLe origini\nAnnus Primus\nDai Fondatori alle comunità antiche: comprendere come una conoscenza diventi patrimonio condiviso.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Le origini","folio":"06","kind":"divider"},{"image":"pages/page-07.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · I Quattro Fondatori 8\nLa nascita di Hogwarts, intorno al 990\nLezione 2 · Prima di Hogwarts 11\nComunità britanniche, consuetudini e accordi\nSettimana II\nLezione 3 · Le tracce della magia antica 14\nPreistoria, scrittura e interpretazione\nLezione 4 · Custodire e trasmettere 17\nDai saperi antichi alla scuola\nTraguardo\nDai Fondatori alle comunità antiche: comprendere come una conoscenza diventi patrimonio condiviso.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"07","kind":"theory"},{"image":"pages/page-08.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Settimana I\nI Quattro Fondatori\nLa nascita di Hogwarts, intorno al 990\nIntorno al 990 Godric Grifondoro, Priscilla Corvonero, Edvige Tassorosso e Salazar Serpeverde unirono le proprie conoscenze per fondare Hogwarts. Il progetto offriva una sede stabile all’insegnamento in un mondo nel quale la formazione dipendeva soprattutto dalle famiglie e dalle comunità. Una scuola comune non era un esito inevitabile: richiedeva fiducia, risorse e accordi tra persone differenti.\nCoraggio e determinazione, conoscenza e intelligenza, impegno e lealtà, ambizione e astuzia entrarono nell’eredità delle quattro Case. Questi orientamenti aiutano a comprendere un progetto educativo; non costituiscono un ritratto completo di ogni Fondatore né una misura del valore dei singoli studenti.\nIl contrasto sull’ammissione degli allievi di origine babbana separò Salazar dagli altri Fondatori e lo condusse ad abbandonare la scuola. La sua partenza non cancellò la Casa che porta il suo nome. Lo storico distingue l’istituzione, che continua nel tempo, dalle scelte e dai conflitti delle persone che la fondarono.\nRiferimento: Programma, lezione 1; Manuale, III anno, Hogwarts.","title":"I Quattro Fondatori","folio":"08","kind":"theory"},{"image":"pages/page-09.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 1\nLe nozioni da ricordare\nI Quattro Fondatori\nUna fondazione è un processo\nLa data orientativa colloca l’origine; non significa che ogni edificio, regola e consuetudine attuale esistesse già.\nPersona e simbolo\nUna tradizione può conservare una qualità attribuita a un Fondatore senza documentare ogni episodio della sua vita.\nEredità condivisa\nLa cooperazione iniziale e il dissenso successivo appartengono entrambi alla storia di Hogwarts.\nDomanda da discutere\nAffidereste la vostra istruzione a una scuola appena fondata, della quale nessuno conosce ancora il futuro?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"I Quattro Fondatori · Nozioni","folio":"09","kind":"theory"},{"image":"pages/page-10.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 1\nIl confronto in aula\nI Quattro Fondatori · Scheda della lezione\nApertura\nAffidereste la vostra istruzione a una scuola appena fondata, della quale nessuno conosce ancora il futuro?\n1. Scrivere i quattro nomi e associare a ciascuno il criterio educativo ricordato dal programma.\n2. Classificare tre frasi: Hogwarts ebbe quattro Fondatori; uno fu il migliore; tutte le decisioni furono unanimi.\n3. Separare il fatto della fondazione, il giudizio sul valore e la falsa idea di un accordo permanente.\nDomanda di ripasso\nConoscere una qualità ricordata dalla tradizione permette di ricostruire tutta la persona?\nRisposta ragionata\nNo. Una qualità sintetizza un’eredità educativa; una biografia richiede testimonianze e contesto. Non tutti i giudizi sul carattere hanno lo stesso valore dei fatti documentati.","title":"I Quattro Fondatori · Attività e ripasso","folio":"10","kind":"theory"},{"image":"pages/page-11.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Settimana I\nPrima di Hogwarts\nComunità britanniche, consuetudini e accordi\nPrima delle grandi istituzioni la conoscenza circolava attraverso famiglie, maestri e piccole comunità. Le tradizioni locali potevano custodire competenze importanti, ma l’accesso dipendeva dai rapporti personali. Due giovani della stessa età potevano ricevere preparazioni molto diverse senza che questa differenza dimostrasse una diversa capacità di apprendere.\nNel percorso britannico del programma, il Patto di Caer Daran del 382 rappresenta il riconoscimento di obblighi comuni. Le Tavole di Morcant del 417 richiamano il passaggio dalla consuetudine alla conservazione scritta. Questi riferimenti mostrano esigenze differenti: stabilire un accordo e rendere trasmissibile una conoscenza.\nLa Contesa dei Sette Pozzi, dal 463 al 474, ricorda che collaborazione e conflitto potevano coesistere. L’assenza del Ministero non equivaleva all’assenza di regole. Significava piuttosto che autorità, mezzi di controllo e accordi avevano un’organizzazione diversa da quella conosciuta nel 1890.\nRiferimento: Programma, lezione 2.","title":"Prima di Hogwarts","folio":"11","kind":"theory"},{"image":"pages/page-12.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 2\nLe nozioni da ricordare\nPrima di Hogwarts\nConsuetudine\nUna pratica riconosciuta da una comunità può orientare le decisioni anche prima di una legge scritta.\nAccordo e applicazione\nStabilire una regola non risolve da solo chi debba interpretarla e farla rispettare.\nRisorse e conflitti\nInteressi incompatibili possono produrre tensioni anche tra comunità capaci di commerciare e collaborare.\nDomanda da discutere\nSe tre comunità dipendessero dalla stessa pianta rara, chi dovrebbe decidere come dividerla?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Prima di Hogwarts · Nozioni","folio":"12","kind":"theory"},{"image":"pages/page-13.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 2\nIl confronto in aula\nPrima di Hogwarts · Scheda della lezione\nApertura\nSe tre comunità dipendessero dalla stessa pianta rara, chi dovrebbe decidere come dividerla?\n1. Dividere la classe in tre comunità per un caso immaginario di risorsa insufficiente.\n2. Far proporre un accordo, un criterio di distribuzione e un modo per risolvere le violazioni.\n3. Confrontare l’accordo ottenuto con le funzioni di un patto e di una regola conservata per iscritto.\nDomanda di ripasso\nPerché l’assenza del Ministero non dimostra che ciascuno potesse fare qualsiasi cosa?\nRisposta ragionata\nPerché consuetudini, accordi e autorità locali potevano già regolare i rapporti. Il problema è ricostruire chi riconoscesse quelle regole e con quali strumenti fossero applicate.","title":"Prima di Hogwarts · Attività e ripasso","folio":"13","kind":"theory"},{"image":"pages/page-14.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Settimana II\nLe tracce della magia antica\nPreistoria, scrittura e interpretazione\nStudiare le origini significa interrogare testimonianze molto diverse dai registri di un’amministrazione. Un oggetto, un’immagine o un luogo possono essere conservati senza che sia giunta fino a noi una spiegazione del loro uso. L’assenza di scrittura rende spesso più difficile distinguere intenzione, significato simbolico e risultato concreto.\nIl manuale richiama riti, rappresentazioni e oggetti delle società antiche. Questi materiali aiutano a studiare ciò che una comunità temeva, sperava o considerava importante. Una figura di caccia, tuttavia, non prova da sola che un incantesimo abbia prodotto l’esito desiderato. Il significato attribuito al rito e la dimostrazione della sua efficacia sono domande diverse.\nCon la scrittura, nelle civiltà mesopotamiche ed egizie, diventa possibile conservare descrizioni e procedure con maggiore continuità. Ma una fonte scritta deve ancora essere interpretata: lingua, funzione e ambiente di produzione contano. Nessuno di questi indizi permette di fissare con certezza un unico momento nel quale sarebbe nata tutta la magia.\nRiferimento: Manuale, I anno, origini, preistoria, Mesopotamia ed Egizi; rielaborazione critica.","title":"Le tracce della magia antica","folio":"14","kind":"theory"},{"image":"pages/page-15.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 3\nLe nozioni da ricordare\nLe tracce della magia antica\nPreistoria\nIndica un passato studiato senza testimonianze scritte dirette delle comunità considerate; non è sinonimo di assenza di cultura.\nTraccia e spiegazione\nIl reperto è ciò che esaminiamo; la sua funzione è una ricostruzione da motivare.\nRito propiziatorio\nÈ rivolto a ottenere un esito favorevole. La descrizione dello scopo non certifica il successo di ogni esecuzione.\nDomanda da discutere\nUn disegno antico dimostra ciò che accadde oppure ciò che qualcuno volle rappresentare?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Le tracce della magia antica · Nozioni","folio":"15","kind":"theory"},{"image":"pages/page-16.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 3\nIl confronto in aula\nLe tracce della magia antica · Scheda della lezione\nApertura\nUn disegno antico dimostra ciò che accadde oppure ciò che qualcuno volle rappresentare?\n1. Presentare il disegno immaginario di una scena di caccia e descrivere solo gli elementi visibili.\n2. Formulare due interpretazioni possibili, senza trasformarle in fatti.\n3. Indicare quale ulteriore testimonianza aiuterebbe a scegliere tra le interpretazioni.\nDomanda di ripasso\nPerché non possiamo ricavare una formula precisa da qualsiasi simbolo antico?\nRisposta ragionata\nPerché forma grafica, significato e uso non sono equivalenti. Senza un contesto o riscontri aggiuntivi, attribuire una formula sarebbe una congettura.","title":"Le tracce della magia antica · Attività e ripasso","folio":"16","kind":"theory"},{"image":"pages/page-17.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Settimana II\nCustodire e trasmettere\nDai saperi antichi alla scuola\nLe società antiche non conservarono tutte le conoscenze allo stesso modo. Il manuale propone il confronto tra ambienti mediterranei e tradizioni celtiche: insegnamento, ritualità, memoria e scrittura assumono forme diverse. La diversità dei mezzi di trasmissione non permette di ordinare automaticamente intere comunità dalla più sapiente alla meno sapiente.\nUna tradizione affidata alla memoria richiede continuità tra persone. Un testo può circolare oltre il proprio autore, ma può anche essere copiato male, tradotto o sottratto alla consultazione. La conservazione non coincide quindi con l’accesso: un sapere custodito può rimanere sconosciuto a gran parte della comunità.\nHogwarts si comprende meglio all’interno di questa lunga storia dell’insegnamento. La scuola riunisce allievi, maestri e materiali in un luogo riconoscibile. Non inventa ogni conoscenza che trasmette e non cancella immediatamente gli apprendimenti familiari. Il primo anno si conclude collegando origini, conservazione e responsabilità di chi insegna.\nRiferimento: Programma, lezioni 1–2; Manuale, II anno, civiltà mediterranee e Celti.","title":"Custodire e trasmettere","folio":"17","kind":"theory"},{"image":"pages/page-18.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 4\nLe nozioni da ricordare\nCustodire e trasmettere\nTradizione orale\nNon è automaticamente falsa: richiede domande sulla catena di trasmissione e sulle trasformazioni subite.\nTesto e accesso\nUn sapere può essere scritto ma riservato a pochi. Conservazione e diffusione sono due processi distinti.\nDruidi e memoria\nIl riferimento celtico permette di discutere il ruolo di figure specializzate nella custodia del sapere, senza attribuire a tutte le comunità pratiche identiche.\nDomanda da discutere\nÈ più importante possedere un libro oppure sapere chi può leggerlo e comprenderlo?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Custodire e trasmettere · Nozioni","folio":"18","kind":"theory"},{"image":"pages/page-19.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno I · Lectio 4\nIl confronto in aula\nCustodire e trasmettere · Scheda della lezione\nApertura\nÈ più importante possedere un libro oppure sapere chi può leggerlo e comprenderlo?\n1. Confrontare tre modelli: apprendimento familiare, maestro locale e scuola comune.\n2. Per ciascuno indicare un vantaggio e una possibile difficoltà nella trasmissione.\n3. Riprendere i Fondatori e spiegare quale problema istituzionale affronti la nascita di una scuola.\nDomanda di ripasso\nUna scuola rende subito identica la preparazione di tutti gli studenti?\nRisposta ragionata\nNo. Crea una struttura comune, ma restano differenze di accesso, insegnamento e comprensione. Le successive riforme educative nasceranno anche da questi problemi.\nConcluso il ciclo di due settimane. Si prosegue con l’anno II.","title":"Custodire e trasmettere · Attività e ripasso","folio":"19","kind":"theory"},{"image":"pages/page-20.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II\nPersone, racconti e leggende\nAnnus Secundus\nDistinguere persone storiche, tradizioni e giudizi, confrontando le forme della memoria.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Persone, racconti e leggende","folio":"20","kind":"divider"},{"image":"pages/page-21.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Merlino, tra uomo e memoria 22\nIl personaggio storico e la tradizione\nLezione 2 · Eroi e racconti contrapposti 25\nMorgana e la costruzione di una reputazione\nSettimana II\nLezione 3 · Quando nasce una leggenda 28\nMemoria, omissioni e trasformazioni\nLezione 4 · Monumenti e tradizioni 31\nChe cosa dimostra un ricordo pubblico?\nTraguardo\nDistinguere persone storiche, tradizioni e giudizi, confrontando le forme della memoria.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"21","kind":"theory"},{"image":"pages/page-22.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Settimana I\nMerlino, tra uomo e memoria\nIl personaggio storico e la tradizione\nMerlino occupa un posto centrale nella memoria magica britannica. Il programma lo presenta come personaggio storico sul quale si sono accumulate tradizioni, imprese e interpretazioni. La notorietà rende più ricca la memoria di una figura, ma non rende automaticamente verificabile ogni racconto che la riguarda.\nLa tradizione associa Merlino a Hogwarts e a Serpeverde; altre narrazioni lo pongono accanto a sovrani e cavalieri. Il compito dello storico non consiste nel saldare tutti questi racconti in una biografia priva di incertezze. Occorre distinguere la singola testimonianza dalla ricostruzione successiva e dichiarare quale rapporto abbiano tra loro.\nAnche un racconto non verificato può essere studiato. Può rivelare quali qualità una comunità desiderasse celebrare o quale immagine del passato volesse tramandare. Il suo valore come testimonianza della memoria non coincide però con la prova che ogni impresa narrata sia realmente avvenuta.\nRiferimento: Programma, lezione 3; Manuale, IV anno, Merlino e Morgana.","title":"Merlino, tra uomo e memoria","folio":"22","kind":"theory"},{"image":"pages/page-23.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 1\nLe nozioni da ricordare\nMerlino, tra uomo e memoria\nEsistenza e giudizio\nDire che un personaggio è esistito è diverso dal definirlo il più grande di ogni tempo.\nTradizioni sovrapposte\nRacconti nati in ambienti ed epoche differenti possono modificare lo stesso personaggio.\nBiografia prudente\nUna ricostruzione attendibile segnala i limiti delle notizie, invece di riempirli con imprese plausibili.\nDomanda da discutere\nQuale ricordo vi viene in mente ascoltando il nome Merlino, e da chi lo avete appreso?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Merlino, tra uomo e memoria · Nozioni","folio":"23","kind":"theory"},{"image":"pages/page-24.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 1\nIl confronto in aula\nMerlino, tra uomo e memoria · Scheda della lezione\nApertura\nQuale ricordo vi viene in mente ascoltando il nome Merlino, e da chi lo avete appreso?\n1. Raccogliere tre ricordi della classe e indicarne la provenienza.\n2. Separare un fatto presentato dal programma, una tradizione e un giudizio di grandezza.\n3. Scrivere due righe su Merlino usando formule che rendano riconoscibile il grado di certezza.\nDomanda di ripasso\nLa fama rende tutte le imprese attribuite a un personaggio ugualmente attendibili?\nRisposta ragionata\nNo. La fama spiega la circolazione dei racconti; ogni impresa richiede una valutazione delle testimonianze che la sostengono.","title":"Merlino, tra uomo e memoria · Attività e ripasso","folio":"24","kind":"theory"},{"image":"pages/page-25.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Settimana I\nEroi e racconti contrapposti\nMorgana e la costruzione di una reputazione\nNel manuale Merlino e Morgana sono raccontati attraverso tradizioni che ne contrappongono spesso i ruoli. Questo contrasto offre un caso di studio: una narrazione può rendere comprensibile uno scontro distribuendo le parti dell’eroe e dell’avversario. La chiarezza del racconto non garantisce però una ricostruzione completa.\nPer valutare una reputazione bisogna chiedersi chi narri, a chi si rivolga e quale qualità desideri esaltare o condannare. Due racconti possono descrivere lo stesso gesto come fedeltà oppure ostinazione. Il cambiamento di giudizio non dimostra, da solo, che uno dei narratori possieda tutte le informazioni.\nLe narrazioni antiche, comprese quelle greche e romane richiamate dal manuale, aiutano a riconoscere questo problema. Lo storico studia il linguaggio dei racconti senza ricavare da ogni episodio una capacità magica accertata. Nomi, simboli e valori possono sopravvivere più a lungo delle prove sugli eventi.\nRiferimento: Programma, lezione 3; Manuale, II e IV anno; confronto didattico originale.","title":"Eroi e racconti contrapposti","folio":"25","kind":"theory"},{"image":"pages/page-26.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 2\nLe nozioni da ricordare\nEroi e racconti contrapposti\nReputazione\nÈ l’immagine pubblica costruita da giudizi e racconti; non coincide con un elenco completo di fatti.\nContrapposizione narrativa\nPresentare due persone come opposti può semplificare differenze più complesse.\nContesto del narratore\nUn autore scrive per lettori e scopi determinati: anche la scelta di ciò che omette può essere significativa.\nDomanda da discutere\nLo stesso gesto può apparire coraggioso a un narratore e imprudente a un altro?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Eroi e racconti contrapposti · Nozioni","folio":"26","kind":"theory"},{"image":"pages/page-27.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 2\nIl confronto in aula\nEroi e racconti contrapposti · Scheda della lezione\nApertura\nLo stesso gesto può apparire coraggioso a un narratore e imprudente a un altro?\n1. Inventare un episodio ordinario con una decisione rischiosa e descriverlo da due punti di vista.\n2. Sottolineare i fatti comuni alle due versioni e cerchiare gli aggettivi di giudizio.\n3. Collegare l’esercizio alle figure di Merlino e Morgana, senza aggiungere eventi alla loro biografia.\nDomanda di ripasso\nDue giudizi opposti dimostrano necessariamente due avvenimenti diversi?\nRisposta ragionata\nNo. Possono essere interpretazioni differenti dello stesso gesto. Prima di scegliere un giudizio bisogna ricostruire le informazioni disponibili.","title":"Eroi e racconti contrapposti · Attività e ripasso","folio":"27","kind":"theory"},{"image":"pages/page-28.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Settimana II\nQuando nasce una leggenda\nMemoria, omissioni e trasformazioni\nUn racconto può cambiare anche quando nessuno intende mentire. Chi ascolta seleziona ciò che considera importante; chi ricorda collega informazioni, tralascia dettagli o attribuisce un’intenzione non dichiarata. La ripetizione attraverso generazioni può stabilizzare una versione già modificata.\nQuesto processo non rende inutile la tradizione. La versione tardiva può conservare una parte di un evento e aggiungere elementi che riflettono i bisogni di chi la tramanda. Lo storico deve chiedersi quali parti siano sostenute da riscontri e quali appartengano alla costruzione della memoria.\nUna testimonianza orale non è falsa soltanto perché non è scritta; una cronaca non è vera soltanto perché usa un tono autorevole. Provenienza, distanza dagli eventi, possibilità di verifica e dipendenza da altri racconti permettono una valutazione più precisa del semplice confronto tra voce e pergamena.\nRiferimento: Programma, lezione 4.","title":"Quando nasce una leggenda","folio":"28","kind":"theory"},{"image":"pages/page-29.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 3\nLe nozioni da ricordare\nQuando nasce una leggenda\nErrore e falsificazione\nUn’informazione inesatta può derivare da memoria imperfetta oppure da alterazione volontaria: non sono la stessa cosa.\nDistanza temporale\nUna fonte vicina può conoscere dettagli, ma essere coinvolta; una lontana può confrontare materiali, ma dipendere da copie.\nTrasmissione\nPiù passaggi richiedono attenzione alla provenienza, non una condanna automatica del racconto.\nDomanda da discutere\nSe venti persone assistono a un fatto, il giorno dopo ne avremo una sola descrizione?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Quando nasce una leggenda · Nozioni","folio":"29","kind":"theory"},{"image":"pages/page-30.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 3\nIl confronto in aula\nQuando nasce una leggenda · Scheda della lezione\nApertura\nSe venti persone assistono a un fatto, il giorno dopo ne avremo una sola descrizione?\n1. Comunicare una breve storia immaginaria a uno studente, che la trasmetta una volta al successivo.\n2. Confrontare l’ultima versione con quella iniziale, anche se non presenta differenze.\n3. Distinguere cambiamenti osservati, possibili cause e intenzioni che non possiamo dimostrare.\nDomanda di ripasso\nSe un dettaglio cambia, possiamo concludere subito che qualcuno abbia mentito?\nRisposta ragionata\nNo. Occorre distinguere omissione, memoria, incomprensione e alterazione deliberata. Il cambiamento non ne dimostra da solo la causa.","title":"Quando nasce una leggenda · Attività e ripasso","folio":"30","kind":"theory"},{"image":"pages/page-31.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Settimana II\nMonumenti e tradizioni\nChe cosa dimostra un ricordo pubblico?\nUn monumento può ricordare un’impresa senza provarne ogni dettaglio. La sua presenza documenta almeno una scelta: qualcuno volle dedicare spazio, risorse e parole a una determinata memoria. Questa scelta appartiene alla storia anche quando la vicenda celebrata rimane incerta.\nLa stessa distinzione vale per nomi, commemorazioni e tradizioni familiari. Il ricordo pubblico seleziona: può mettere al centro un protagonista, dimenticare chi lo aiutò o trasformare un episodio ambiguo in un esempio morale. Studiare ciò che viene ricordato richiede anche di interrogare ciò che viene escluso.\nIl secondo anno si conclude senza scegliere tra credere a tutto e respingere tutte le leggende. Il lavoro consiste nel formulare affermazioni commisurate alle prove. Si può ricostruire la storia di una celebrazione anche quando non si possiede la certezza dell’evento celebrato.\nRiferimento: Programma, lezioni 3–4; sintesi didattica.","title":"Monumenti e tradizioni","folio":"31","kind":"theory"},{"image":"pages/page-32.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 4\nLe nozioni da ricordare\nMonumenti e tradizioni\nEvento e commemorazione\nIl fatto ricordato e l’atto successivo di ricordarlo sono oggetti di ricerca distinti.\nMemoria selettiva\nOgni racconto dedica più spazio ad alcuni protagonisti e meno ad altri.\nFormula prudente\nDire che una tradizione attribuisce un’impresa rende riconoscibile la natura della notizia.\nDomanda da discutere\nUna statua dedicata a un salvataggio dimostra il salvataggio oppure l’esistenza di una celebrazione?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Monumenti e tradizioni · Nozioni","folio":"32","kind":"theory"},{"image":"pages/page-33.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno II · Lectio 4\nIl confronto in aula\nMonumenti e tradizioni · Scheda della lezione\nApertura\nUna statua dedicata a un salvataggio dimostra il salvataggio oppure l’esistenza di una celebrazione?\n1. Presentare un’iscrizione immaginaria dedicata a uno studente leggendario.\n2. Scrivere una frase certa sulla commemorazione e una domanda ancora aperta sull’impresa.\n3. Riprendere Merlino e spiegare perché il valore di una leggenda non richieda di accettarla alla lettera.\nDomanda di ripasso\nUna leggenda può essere utile allo storico anche se l’episodio non è dimostrato?\nRisposta ragionata\nSì. Può documentare valori, aspettative e scelte della comunità che la conserva. Questo non prova automaticamente l’episodio narrato.\nConcluso il ciclo di due settimane. Si prosegue con l’anno III.","title":"Monumenti e tradizioni · Attività e ripasso","folio":"33","kind":"theory"},{"image":"pages/page-34.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III\nMaghi e Babbani\nAnnus Tertius\nComprendere convivenza, persecuzioni e Segretezza senza ridurre il passato a un’unica esperienza.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Maghi e Babbani","folio":"34","kind":"divider"},{"image":"pages/page-35.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Maghi e Babbani 36\nLa convivenza prima della Segretezza\nLezione 2 · Accuse e persecuzioni 39\nLa testimonianza non coincide con il verdetto\nSettimana II\nLezione 3 · Lo Statuto del 1692 42\nUna responsabilità comune\nLezione 4 · Vivere dopo lo Statuto 45\nLa legge nelle scelte quotidiane\nTraguardo\nComprendere convivenza, persecuzioni e Segretezza senza ridurre il passato a un’unica esperienza.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"35","kind":"theory"},{"image":"pages/page-36.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Settimana I\nMaghi e Babbani\nLa convivenza prima della Segretezza\nPrima dell’adozione della Segretezza, i rapporti tra popolazioni magiche e non magiche non seguirono ovunque un solo modello. Prossimità, scambi, dipendenza reciproca e diffidenza potevano trovarsi nello stesso territorio. Una distinzione netta nel 1890 non deve essere proiettata automaticamente su ogni epoca precedente.\nUna comunità poteva conoscere una famiglia di maghi senza comprenderne le capacità. Un aiuto poteva essere apprezzato in una circostanza e temuto in un’altra. La storia dei rapporti richiede quindi attenzione alle situazioni concrete, invece di immaginare secoli di armonia uniforme oppure un’ostilità senza interruzioni.\nLo storico confronta testimonianze di ambienti diversi e ne riconosce il punto di vista. Un documento favorevole non cancella le persecuzioni; un episodio ostile non descrive ogni relazione quotidiana. Capire questa varietà è necessario per studiare le trasformazioni che portarono alla separazione istituzionale.\nRiferimento: Programma, lezione 5; Manuale, I e III anno, rapporti e Medioevo.","title":"Maghi e Babbani","folio":"36","kind":"theory"},{"image":"pages/page-37.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 1\nLe nozioni da ricordare\nMaghi e Babbani\nPopolazioni e individui\nUn racconto su una persona non autorizza a descrivere allo stesso modo un’intera popolazione.\nConvivenza\nIndica rapporti e spazi condivisi; non implica assenza di differenze o tensioni.\nProiezione del presente\nAttribuire al passato le stesse separazioni del 1890 può rendere invisibili forme di relazione differenti.\nDomanda da discutere\nVivere nello stesso villaggio significa necessariamente fidarsi gli uni degli altri?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Maghi e Babbani · Nozioni","folio":"37","kind":"theory"},{"image":"pages/page-38.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 1\nIl confronto in aula\nMaghi e Babbani · Scheda della lezione\nApertura\nVivere nello stesso villaggio significa necessariamente fidarsi gli uni degli altri?\n1. Costruire un caso immaginario di collaborazione tra vicini magici e non magici.\n2. Aggiungere una fonte di tensione senza cancellare la collaborazione iniziale.\n3. Indicare quali notizie servirebbero per comprendere come la relazione cambi nel tempo.\nDomanda di ripasso\nUn episodio di conflitto dimostra che ogni rapporto fosse ostile?\nRisposta ragionata\nNo. Documenta quel conflitto. Per descrivere un’intera epoca servono confronti tra luoghi, gruppi e testimonianze.","title":"Maghi e Babbani · Attività e ripasso","folio":"38","kind":"theory"},{"image":"pages/page-39.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Settimana I\nAccuse e persecuzioni\nLa testimonianza non coincide con il verdetto\nDiffidenza e paura possono trasformare una difficoltà comune in un’accusa. Nei materiali sulle persecuzioni e sui processi, lo storico deve distinguere il fatto di essere accusati dalla dimostrazione di aver compiuto l’azione contestata. Una confessione o un verbale richiedono attenzione alle condizioni in cui furono prodotti.\nIl manuale richiama la caccia alle streghe e i processi di Salem. Il loro studio non deve confondere le credenze degli accusatori con una prova della natura magica degli imputati. Un testo persecutorio è importante per capire come veniva costruita l’accusa, non perché renda vere tutte le sue affermazioni.\nLe fonti possono anche raccontare la stessa vicenda da posizioni incompatibili. Occorre cercare ciò che entrambe sostengono, ciò su cui divergono e i dettagli che ciascuna può effettivamente conoscere. Comprendere una paura collettiva non significa condividere il giudizio che ne derivò.\nRiferimento: Programma, lezione 5; Manuale, III–IV anno, processi e Salem.","title":"Accuse e persecuzioni","folio":"39","kind":"theory"},{"image":"pages/page-40.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 2\nLe nozioni da ricordare\nAccuse e persecuzioni\nAccusa\nÈ un’affermazione da verificare; la sua ripetizione non la trasforma da sola in prova.\nCondizioni della testimonianza\nPressioni, interessi e distanza dai fatti possono influire su ciò che una persona dichiara.\nSalem\nIl caso richiamato dal manuale viene studiato come persecuzione e problema di valutazione delle fonti, evitando una causa unica per tutta la Segretezza.\nDomanda da discutere\nSe un verbale contiene un’accusa, che cosa sappiamo con certezza prima di valutarne il contenuto?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Accuse e persecuzioni · Nozioni","folio":"40","kind":"theory"},{"image":"pages/page-41.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 2\nIl confronto in aula\nAccuse e persecuzioni · Scheda della lezione\nApertura\nSe un verbale contiene un’accusa, che cosa sappiamo con certezza prima di valutarne il contenuto?\n1. Leggere due versioni immaginarie di un raccolto fallito, una accusatoria e una prudente.\n2. Elencare le osservazioni comuni e separarle dalle spiegazioni proposte.\n3. Formulare una domanda di verifica che non presupponga già la colpevolezza.\nDomanda di ripasso\nIl fatto che un’accusa sia conservata in un archivio ne prova la verità?\nRisposta ragionata\nNo. Prova che è stata registrata. Contenuto, provenienza e condizioni di produzione devono essere esaminati.","title":"Accuse e persecuzioni · Attività e ripasso","folio":"41","kind":"theory"},{"image":"pages/page-42.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Settimana II\nLo Statuto del 1692\nUna responsabilità comune\nNel 1692 lo Statuto Internazionale di Segretezza della Magia stabilì un riferimento comune per nascondere l’esistenza della comunità magica al mondo non magico. Il programma lo presenta come una risposta collettiva a problemi che le singole comunità non potevano affrontare stabilmente in modo indipendente.\nLa Segretezza trasformò una precauzione in un obbligo condiviso. Un’esposizione locale poteva avere conseguenze oltre il luogo dell’incidente; per questo prevenzione, intervento e responsabilità dovevano essere coordinati. La scelta offriva protezione, ma comportava anche limitazioni dei contatti e della vita quotidiana.\nIl 1692 non creò immediatamente tutte le istituzioni moderne. Una norma richiede interpretazione, mezzi e persone incaricate di applicarla. Distinguere l’adozione dello Statuto dal successivo sviluppo amministrativo permette di comprendere sia il significato della decisione sia le difficoltà della sua attuazione.\nRiferimento: Programma, lezione 6; Manuale, V anno, Statuto.","title":"Lo Statuto del 1692","folio":"42","kind":"theory"},{"image":"pages/page-43.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 3\nLe nozioni da ricordare\nLo Statuto del 1692\nNorma internazionale\nUn riferimento comune collega comunità diverse; non rende identica ogni modalità di applicazione.\nProtezione e costo\nLa sicurezza deve essere studiata insieme alle restrizioni e ai nuovi problemi che produce.\nDate distinte\nNel programma adottato il 1692 riguarda lo Statuto, mentre il 1708 riguarda la fondazione formale del Ministero britannico.\nDomanda da discutere\nUna decisione può aumentare la protezione e limitare contemporaneamente alcune libertà?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Lo Statuto del 1692 · Nozioni","folio":"43","kind":"theory"},{"image":"pages/page-44.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 3\nIl confronto in aula\nLo Statuto del 1692 · Scheda della lezione\nApertura\nUna decisione può aumentare la protezione e limitare contemporaneamente alcune libertà?\n1. Simulare un consiglio incaricato di discutere la Segretezza nel 1692.\n2. Assegnare a gruppi diversi protezione, relazioni quotidiane e applicazione della norma.\n3. Raccogliere una ragione a favore e una difficoltà concreta per ciascun gruppo.\nDomanda di ripasso\nPerché approvare lo Statuto non equivale a creare subito il Ministero?\nRisposta ragionata\nPerché norma e organizzazione del governo sono processi distinti. Servono strutture, competenze e procedure per applicare una responsabilità comune.","title":"Lo Statuto del 1692 · Attività e ripasso","folio":"44","kind":"theory"},{"image":"pages/page-45.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Settimana II\nVivere dopo lo Statuto\nLa legge nelle scelte quotidiane\nL’effetto di una grande decisione si comprende anche nelle abitudini. Abitare vicino a persone non magiche, lavorare, viaggiare e custodire oggetti richiedono scelte diverse quando l’esposizione della magia diventa responsabilità verso l’intera comunità.\nI cambiamenti non furono necessariamente percepiti allo stesso modo da tutti. Una famiglia già isolata poteva incontrare problemi differenti da chi intratteneva rapporti quotidiani con vicini non magici. Una regola comune produce conseguenze concrete attraverso la situazione di ciascuno.\nValutare la Segretezza richiede di distinguere obiettivo, mezzi e risultati. Proteggere l’esistenza del mondo magico non significa aver eliminato ogni conflitto interno o garantito l’uguaglianza. Il terzo anno si conclude seguendo il passaggio dalla decisione collettiva all’esperienza individuale.\nRiferimento: Programma, lezione 6; applicazione didattica.","title":"Vivere dopo lo Statuto","folio":"45","kind":"theory"},{"image":"pages/page-46.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 4\nLe nozioni da ricordare\nVivere dopo lo Statuto\nApplicazione\nÈ il modo in cui una norma viene tradotta in comportamenti e interventi.\nEsperienze differenti\nLa stessa legge può pesare diversamente su comunità isolate, famiglie e lavoratori.\nRisultati parziali\nUn obiettivo raggiunto non dimostra che ogni conseguenza del provvedimento sia positiva.\nDomanda da discutere\nQuale abitudine cambierebbe per prima in una famiglia abituata a collaborare con vicini non magici?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Vivere dopo lo Statuto · Nozioni","folio":"46","kind":"theory"},{"image":"pages/page-47.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno III · Lectio 4\nIl confronto in aula\nVivere dopo lo Statuto · Scheda della lezione\nApertura\nQuale abitudine cambierebbe per prima in una famiglia abituata a collaborare con vicini non magici?\n1. Confrontare due famiglie immaginarie, una isolata e una inserita in un villaggio misto.\n2. Per ciascuna indicare un cambiamento e un problema di applicazione.\n3. Scrivere un breve bilancio dello Statuto distinguendo protezione, restrizioni e questioni irrisolte.\nDomanda di ripasso\nUna regola uguale per tutti produce necessariamente esperienze identiche?\nRisposta ragionata\nNo. Le condizioni di partenza cambiano il modo in cui le persone ne incontrano benefici, obblighi e difficoltà.\nConcluso il ciclo di due settimane. Si prosegue con l’anno IV.","title":"Vivere dopo lo Statuto · Attività e ripasso","folio":"47","kind":"theory"},{"image":"pages/page-48.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV\nLa Gran Bretagna magica\nAnnus Quartus\nSeguire la costruzione delle istituzioni e distinguere amministrazione, giustizia e libertà.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"La Gran Bretagna magica","folio":"48","kind":"divider"},{"image":"pages/page-49.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Dal Segreto al Ministero 50\n1692–1708: coordinare una comunità\nLezione 2 · La Crisi di Norwich 53\nAutorità centrale e autonomia locale\nSettimana II\nLezione 3 · Giustizia e registri 56\nAccusare, verificare, giudicare\nLezione 4 · La libertà della bacchetta 59\nLa Carta del 1752 e i limiti del potere\nTraguardo\nSeguire la costruzione delle istituzioni e distinguere amministrazione, giustizia e libertà.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"49","kind":"theory"},{"image":"pages/page-50.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Settimana I\nDal Segreto al Ministero\n1692–1708: coordinare una comunità\nDopo lo Statuto fu necessario coordinare interventi su territori differenti. Nel programma la Commissione Britannica della Segretezza rappresenta uno degli strumenti di questa riorganizzazione. Raccogliere notizie, prevenire incidenti e affrontare le violazioni erano funzioni collegate, ma non identiche.\nIl primo censimento amministrativo rispondeva al bisogno di conoscere comunità e popolazione. Le informazioni potevano sostenere servizi e comunicazioni; la loro concentrazione poteva anche essere percepita come controllo. Lo storico non presume che tutti gli abitanti interpretassero allo stesso modo il cambiamento.\nIl Concordato di Westminster Magico del 1708 segnò, nella cronologia del programma, la nascita formale del Ministero della Magia britannico. Tra Statuto e fondazione trascorsero sedici anni. Il Ministero non inaugurò ogni regola della comunità: organizzò in una nuova forma un processo già avviato.\nRiferimento: Programma, lezione 7; cronologia del programma prevalente sul Manuale.","title":"Dal Segreto al Ministero","folio":"50","kind":"theory"},{"image":"pages/page-51.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 1\nLe nozioni da ricordare\nDal Segreto al Ministero\nInformazione, prevenzione, sanzione\nConoscere un problema, impedirlo e intervenire dopo una violazione richiedono strumenti differenti.\nCensimento\nUna raccolta di informazioni può aiutare l’organizzazione e sollevare domande sui limiti del controllo.\nIstituzione\nUna funzione riconoscibile, sostenuta da regole e competenze, si distingue dal prestigio personale di un singolo mago.\nDomanda da discutere\nUna legge senza uffici, informazioni e responsabilità definite può funzionare nello stesso modo ovunque?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Dal Segreto al Ministero · Nozioni","folio":"51","kind":"theory"},{"image":"pages/page-52.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 1\nIl confronto in aula\nDal Segreto al Ministero · Scheda della lezione\nApertura\nUna legge senza uffici, informazioni e responsabilità definite può funzionare nello stesso modo ovunque?\n1. Disegnare una linea del tempo con 1692 e 1708.\n2. Collocare nello spazio intermedio i problemi di coordinamento, senza attribuire date non fornite al censimento.\n3. Progettare un ufficio con un compito preciso e un limite al suo potere.\nDomanda di ripasso\nPerché il Ministero del 1708 non deve essere immaginato identico a quello del 1890?\nRisposta ragionata\nPerché istituzioni, uffici e diritti continuano a trasformarsi. La fondazione non contiene automaticamente tutti gli sviluppi successivi.","title":"Dal Segreto al Ministero · Attività e ripasso","folio":"52","kind":"theory"},{"image":"pages/page-53.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Settimana I\nLa Crisi di Norwich\nAutorità centrale e autonomia locale\nNel programma la Crisi di Norwich mette in luce il conflitto tra una comunità e l’autorità dell’Ufficio Generale nella gestione di incidenti legati alla Segretezza. Dopo mesi di tensione fu raggiunto un compromesso. Non occorre aggiungere protagonisti, vittime o date che il materiale non fornisce per comprenderne il problema istituzionale.\nUn incidente può richiedere rapidità locale e coordinamento più ampio. La difficoltà nasce quando le parti non riconoscono gli stessi confini di competenza. La buona volontà non sostituisce una risposta alla domanda su chi abbia titolo per decidere e a chi debba rendere conto.\nUna crisi precedente a una riforma non ne dimostra da sola la causa. Lo storico deve cercare un collegamento documentato tra difficoltà, discussioni e cambiamenti. Norwich permette di distinguere difetti delle norme, mancanza di mezzi e problemi nell’applicazione, senza dichiararli equivalenti.\nRiferimento: Programma, lezione 7.","title":"La Crisi di Norwich","folio":"53","kind":"theory"},{"image":"pages/page-54.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 2\nLe nozioni da ricordare\nLa Crisi di Norwich\nCompetenza\nÈ l’ambito nel quale un’autorità è incaricata di intervenire.\nCompromesso\nPuò comporre una controversia senza cancellare ogni differenza tra le parti.\nCausa e successione\nSapere che un evento viene prima di un altro non basta a dimostrare che lo abbia prodotto.\nDomanda da discutere\nSe una comunità risolve rapidamente un incidente, può ignorarne ogni conseguenza per i territori vicini?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La Crisi di Norwich · Nozioni","folio":"54","kind":"theory"},{"image":"pages/page-55.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 2\nIl confronto in aula\nLa Crisi di Norwich · Scheda della lezione\nApertura\nSe una comunità risolve rapidamente un incidente, può ignorarne ogni conseguenza per i territori vicini?\n1. Assegnare due ruoli in un caso immaginario: comunità locale e ufficio di coordinamento.\n2. Far proporre un compito per ciascuno e una procedura per i disaccordi.\n3. Confrontare la soluzione con il problema di Norwich, distinguendo l’esercizio dai fatti disponibili.\nDomanda di ripasso\nUn’amministrazione in difficoltà dimostra necessariamente che ogni sua norma fosse sbagliata?\nRisposta ragionata\nNo. Il problema può riguardare norme, strumenti, competenze o applicazione. Occorre individuare quali elementi sostengano ciascuna spiegazione.","title":"La Crisi di Norwich · Attività e ripasso","folio":"55","kind":"theory"},{"image":"pages/page-56.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Settimana II\nGiustizia e registri\nAccusare, verificare, giudicare\nLa costruzione di istituzioni comuni riguarda anche il giudizio sulle controversie. Nel programma l’Ufficio di Giustizia Magica richiama la gestione amministrativa e operativa delle procedure, mentre l’Alta Corte della Comunità permette di affrontare il problema della valutazione delle accuse.\nChi formula un’accusa, chi raccoglie gli elementi e chi giudica svolgono funzioni diverse. La provenienza autorevole di un’affermazione non sostituisce l’esame delle prove. La presenza di un tribunale non garantisce l’assenza di errori, ma una procedura riconoscibile rende possibile chiedere come si sia arrivati a una decisione.\nI registri conservano tracce di ordini, motivazioni e responsabilità. Possono permettere di ricostruire una scelta anche dopo la scomparsa dei suoi autori. Tuttavia, la registrazione non rende giusto ogni provvedimento: anche il documento amministrativo può contenere errori e omissioni.\nRiferimento: Programma, lezione 8.","title":"Giustizia e registri","folio":"56","kind":"theory"},{"image":"pages/page-57.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 3\nLe nozioni da ricordare\nGiustizia e registri\nAccusa e prova\nUna contestazione apre una domanda; non contiene già la dimostrazione della colpa.\nMemoria amministrativa\nRegistrare consente di ricostruire chi abbia deciso, quando e sulla base di quali ragioni.\nAutenticità e correttezza\nUn documento realmente prodotto da un ufficio può contenere una decisione sbagliata.\nDomanda da discutere\nAccettereste un provvedimento spiegato soltanto con le parole “è stato deciso così”?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Giustizia e registri · Nozioni","folio":"57","kind":"theory"},{"image":"pages/page-58.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 3\nIl confronto in aula\nGiustizia e registri · Scheda della lezione\nApertura\nAccettereste un provvedimento spiegato soltanto con le parole “è stato deciso così”?\n1. Compilare un provvedimento immaginario con autore, data, motivazione e ambito di applicazione.\n2. Far individuare alla classe quale informazione manchi in una versione abbreviata.\n3. Distinguere ciò che il documento prova da ciò che resta da verificare sul caso.\nDomanda di ripasso\nUn ordine autentico è necessariamente anche corretto?\nRisposta ragionata\nNo. L’autenticità riguarda la provenienza; la correttezza richiede di valutare ragioni, competenze e circostanze.","title":"Giustizia e registri · Attività e ripasso","folio":"58","kind":"theory"},{"image":"pages/page-59.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Settimana II\nLa libertà della bacchetta\nLa Carta del 1752 e i limiti del potere\nLa Carta della Libertà della Bacchetta del 1752, richiamata dal programma, consente di studiare il rapporto tra autonomia e sicurezza. La bacchetta è uno strumento con cui il mago apprende, lavora e può difendersi. La sua sottrazione può quindi incidere su molti aspetti della vita.\nLo stesso strumento può essere usato per danneggiare altri. Il problema storico non si risolve dichiarando assoluta la libertà oppure sufficiente ogni richiamo alla sicurezza. Bisogna comprendere chi possa limitare un diritto, per quali ragioni e con quali possibilità di controllo.\nIl quarto anno si conclude collegando istituzioni e limiti. Una comunità deve poter affrontare i pericoli senza rendere ogni decisione arbitraria. Il registro di un provvedimento e la distinzione delle funzioni giudiziarie aiutano a porre domande precise sul potere, senza inventare articoli della Carta non riportati dal programma.\nRiferimento: Programma, lezione 8.","title":"La libertà della bacchetta","folio":"59","kind":"theory"},{"image":"pages/page-60.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 4\nLe nozioni da ricordare\nLa libertà della bacchetta\nAutonomia\nComprende la possibilità concreta di esercitare capacità e svolgere attività.\nMotivazione\nUna limitazione richiede ragioni riconoscibili; la formula generica della sicurezza non spiega ogni decisione.\nControllo del potere\nChiedere chi decida e come si possa contestare una scelta è diverso dal negare ogni autorità.\nDomanda da discutere\nQuali parti della vostra vita cambierebbero se non poteste più usare la bacchetta per un tempo indefinito?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La libertà della bacchetta · Nozioni","folio":"60","kind":"theory"},{"image":"pages/page-61.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno IV · Lectio 4\nIl confronto in aula\nLa libertà della bacchetta · Scheda della lezione\nApertura\nQuali parti della vostra vita cambierebbero se non poteste più usare la bacchetta per un tempo indefinito?\n1. Presentare un villaggio immaginario nel quale un incidente susciti una richiesta di limitazioni generali.\n2. Far proporre una risposta motivata e un criterio per riesaminarla.\n3. Collegare libertà, giustizia e registri, distinguendo la discussione dal testo storico della Carta.\nDomanda di ripasso\nLa sicurezza rende automaticamente giustificata qualsiasi limitazione?\nRisposta ragionata\nNo. Devono essere esaminate ragioni, competenze, estensione e controllo della decisione. Il richiamo a un obiettivo non dimostra l’adeguatezza di ogni mezzo.\nConcluso il ciclo di due settimane. Si prosegue con l’anno V.","title":"La libertà della bacchetta · Attività e ripasso","folio":"61","kind":"theory"},{"image":"pages/page-62.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V\nIstruzione e cittadinanza\nAnnus Quintus\nCollegare preparazione scolastica, rappresentanza e responsabilità del governo.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Istruzione e cittadinanza","folio":"62","kind":"divider"},{"image":"pages/page-63.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · La Riforma Hawthorne 64\n1778: rendere condivise le basi\nLezione 2 · La Preparazione Standard 67\nDagli undici ai quindici anni, prima della pratica scolastica\nSettimana II\nLezione 3 · La rappresentanza del 1819 70\nGovernare e ricevere un mandato\nLezione 4 · Rendere conto del governo 73\nLucien Barrow e le dimissioni del 1824\nTraguardo\nCollegare preparazione scolastica, rappresentanza e responsabilità del governo.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"63","kind":"theory"},{"image":"pages/page-64.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Settimana I\nLa Riforma Hawthorne\n1778: rendere condivise le basi\nLa fondazione di una scuola non eliminò subito le differenze nella formazione iniziale. Famiglie, precettori e comunità continuarono a offrire opportunità diseguali. Il possesso di libri e la disponibilità di un maestro potevano cambiare ciò che un giovane aveva studiato prima di arrivare a Hogwarts.\nLa Petizione dei Precettori si inserisce nel percorso che portò a discutere questa frammentazione. Anche insegnanti preparati potevano seguire criteri molto diversi. Una base comune cercava di rendere riconoscibili gli obiettivi, senza confondere le opportunità ricevute con l’intelligenza dell’allievo.\nNel 1778 la Riforma Hawthorne organizzò il percorso educativo intorno alla Preparazione Standard e all’ingresso a Hogwarts a sedici anni. Il sistema ha quindi una storia: non deriva da un’età imposta dalla natura della magia. La riforma affronta un problema preciso, senza garantire che ogni disuguaglianza scompaia.\nRiferimento: Programma, lezione 9.","title":"La Riforma Hawthorne","folio":"64","kind":"theory"},{"image":"pages/page-65.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 1\nLe nozioni da ricordare\nLa Riforma Hawthorne\nOpportunità e capacità\nUna preparazione più ampia può dipendere dalle risorse disponibili, non da una superiorità personale.\nPetizione\nÈ una richiesta collettiva che permette di discutere problemi e proposte; non equivale già alla riforma approvata.\nBase comune\nStabilisce riferimenti per l’insegnamento, senza rendere uguale la comprensione di ogni studente.\nDomanda da discutere\nPerché avete iniziato Hogwarts a sedici anni, e non a un’altra età?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La Riforma Hawthorne · Nozioni","folio":"65","kind":"theory"},{"image":"pages/page-66.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 1\nIl confronto in aula\nLa Riforma Hawthorne · Scheda della lezione\nApertura\nPerché avete iniziato Hogwarts a sedici anni, e non a un’altra età?\n1. Confrontare due percorsi immaginari con risorse familiari diverse.\n2. Indicare un problema che la preparazione comune può affrontare e uno che può restare aperto.\n3. Collocare Petizione e Riforma come momenti diversi, senza inventare una data per la prima.\nDomanda di ripasso\nUna riforma che stabilisce basi comuni elimina da sola ogni disuguaglianza?\nRisposta ragionata\nNo. Riduce una frammentazione del programma, ma risorse, insegnanti e condizioni personali possono continuare a differire.","title":"La Riforma Hawthorne · Attività e ripasso","folio":"66","kind":"theory"},{"image":"pages/page-67.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Settimana I\nLa Preparazione Standard\nDagli undici ai quindici anni, prima della pratica scolastica\nNel percorso scolastico adottato, la Preparazione Standard riguarda gli anni dagli undici ai quindici e ha carattere teorico. Si svolge senza bacchetta e senza pratica magica volontaria. L’ingresso a sedici anni apre il successivo apprendimento scolastico guidato.\nConoscere un nome, comprendere un principio ed eseguire una formula non sono capacità equivalenti. La formazione iniziale costruisce lessico, contesto e comprensione; non dimostra che l’allievo abbia già sperimentato volontariamente gli incantesimi. Una manifestazione involontaria non costituisce un programma di esercitazione.\nLa storia della riforma aiuta a leggere il presente. Gli allievi possono aver ricevuto spiegazioni differenti pur seguendo gli stessi riferimenti teorici. Il docente deve riconoscere ciò che è stato compreso e ciò che richiede chiarimento, senza attribuire pratica precedente dove il percorso non la prevede.\nRiferimento: Programma, lezione 9; ordinamento scolastico Hawthorne adottato per il corso.","title":"La Preparazione Standard","folio":"67","kind":"theory"},{"image":"pages/page-68.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 2\nLe nozioni da ricordare\nLa Preparazione Standard\nSapere e saper eseguire\nLa conoscenza teorica non equivale a una padronanza pratica dimostrata.\nConfine del percorso\nUndici–quindici anni: preparazione teorica; sedici anni: ingresso a Hogwarts secondo l’ordinamento adottato.\nInvolontarietà\nUn fenomeno spontaneo non dimostra studio pratico né autorizza a descrivere esercitazioni volontarie prima dell’ingresso.\nDomanda da discutere\nSi può conoscere il significato di una formula senza averla mai eseguita?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La Preparazione Standard · Nozioni","folio":"68","kind":"theory"},{"image":"pages/page-69.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 2\nIl confronto in aula\nLa Preparazione Standard · Scheda della lezione\nApertura\nSi può conoscere il significato di una formula senza averla mai eseguita?\n1. Elencare attività compatibili con una preparazione teorica: lettura, descrizione e confronto.\n2. Separarle da un tentativo volontario di esecuzione.\n3. Collegare questa distinzione agli obiettivi di una base comune e del successivo insegnamento guidato.\nDomanda di ripasso\nConoscere il nome di un incantesimo prova che lo si sia già praticato?\nRisposta ragionata\nNo. Nome, principio ed esecuzione sono livelli diversi. La Preparazione Standard qui descritta resta teorica.","title":"La Preparazione Standard · Attività e ripasso","folio":"69","kind":"theory"},{"image":"pages/page-70.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Settimana II\nLa rappresentanza del 1819\nGovernare e ricevere un mandato\nIl Decreto di Rappresentanza del 1819, nel programma, costituisce un passaggio nello sviluppo della partecipazione politica britannica. Il suo studio collega diritto di voto, elezione del Ministro e ruolo dei cittadini, distinguendoli dalla semplice esistenza di un’autorità centrale.\nUn governante può prendere decisioni competenti senza essere stato scelto da tutte le persone che ne subiscono le conseguenze. La rappresentanza riguarda anche il modo in cui il potere viene formato. Il fatto che si svolga un’elezione non risponde da solo a tutte le domande su accesso, libertà della scelta e condizioni del voto.\nLo storico deve conoscere le regole effettive, senza inventare requisiti non forniti dai documenti. Il cittadino, a sua volta, ha bisogno di confrontare proposte e risultati. La popolarità di un nome e il prestigio familiare non sostituiscono l’esame del programma di governo.\nRiferimento: Programma, lezione 10.","title":"La rappresentanza del 1819","folio":"70","kind":"theory"},{"image":"pages/page-71.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 3\nLe nozioni da ricordare\nLa rappresentanza del 1819\nAutorità e rappresentanza\nEsercitare un potere riconosciuto non dice ancora chi partecipi alla scelta di chi lo detiene.\nMandato\nLa scelta di un governante non rende infallibili tutte le sue decisioni.\nPartecipazione\nInformarsi e chiedere conto dell’azione pubblica sono questioni distinte dal solo atto del voto.\nDomanda da discutere\nEssere un buon amministratore basta a risolvere il problema di chi abbia diritto di scegliere il governo?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La rappresentanza del 1819 · Nozioni","folio":"71","kind":"theory"},{"image":"pages/page-72.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 3\nIl confronto in aula\nLa rappresentanza del 1819 · Scheda della lezione\nApertura\nEssere un buon amministratore basta a risolvere il problema di chi abbia diritto di scegliere il governo?\n1. Proporre tre candidati immaginari con priorità differenti, senza usare cariche contemporanee reali.\n2. Far motivare la preferenza sulla base delle proposte.\n3. Chiedere quali informazioni manchino prima di giudicare il sistema elettorale nel suo insieme.\nDomanda di ripasso\nL’esistenza del voto dimostra da sola che ogni cittadino possa partecipare nelle stesse condizioni?\nRisposta ragionata\nNo. Servono informazioni sui requisiti, sulle procedure e sulla libertà della scelta. Non si deducono regole mancanti dal solo nome di una riforma.","title":"La rappresentanza del 1819 · Attività e ripasso","folio":"72","kind":"theory"},{"image":"pages/page-73.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Settimana II\nRendere conto del governo\nLucien Barrow e le dimissioni del 1824\nNel 1824 Lucien Barrow lasciò la carica di Ministro della Magia mediante dimissioni. Il programma utilizza questo precedente per studiare la responsabilità di chi governa. Il fatto delle dimissioni non autorizza ad attribuire reati, motivazioni private o cause non documentate.\nLa responsabilità giuridica riguarda il rispetto delle norme e le conseguenze delle loro violazioni. Quella politica riguarda decisioni, mandato e fiducia. Un provvedimento può essere criticato senza che sia un reato; un governante eletto può essere chiamato a spiegare le proprie scelte senza che ciò neghi il valore dell’elezione.\nIl quinto anno collega dunque istruzione e cittadinanza. Una comunità ha bisogno di basi per comprendere ciò che viene deciso in suo nome. Il controllo pubblico non si esaurisce nel momento in cui una carica viene assegnata: prosegue attraverso informazioni, confronto e giudizio sui risultati.\nRiferimento: Programma, lezione 10.","title":"Rendere conto del governo","folio":"73","kind":"theory"},{"image":"pages/page-74.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 4\nLe nozioni da ricordare\nRendere conto del governo\nDimissioni\nIndicano la rinuncia alla carica; non costituiscono automaticamente una confessione di illecito.\nResponsabilità politica\nRiguarda anche fiducia e adeguatezza delle scelte, oltre alla conformità formale alle norme.\nGiudizio informato\nValutare un risultato richiede distinguere obiettivo promesso, decisioni prese e condizioni incontrate.\nDomanda da discutere\nUn governante può rispondere a ogni critica ricordando soltanto di essere stato eletto?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Rendere conto del governo · Nozioni","folio":"74","kind":"theory"},{"image":"pages/page-75.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno V · Lectio 4\nIl confronto in aula\nRendere conto del governo · Scheda della lezione\nApertura\nUn governante può rispondere a ogni critica ricordando soltanto di essere stato eletto?\n1. Scrivere una notizia prudente sulle dimissioni del 1824 usando solo i dati del programma.\n2. Confrontarla con una versione che aggiunga una colpa non dimostrata.\n3. Riprendere il 1819 e spiegare perché scelta del governante e controllo del suo operato siano questioni collegate.\nDomanda di ripasso\nLe dimissioni dimostrano necessariamente la commissione di un reato?\nRisposta ragionata\nNo. La rinuncia alla carica e la colpevolezza giuridica sono affermazioni differenti, che richiedono prove differenti.\nConcluso il ciclo di due settimane. Si prosegue con l’anno VI.","title":"Rendere conto del governo · Attività e ripasso","folio":"75","kind":"theory"},{"image":"pages/page-76.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI\nIl secolo del cambiamento\nAnnus Sextus\nLeggere il progresso attraverso lavoro, produzione, ricerca e responsabilità.\nL’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri, ciascuno con spiegazione, nozioni e lavoro in aula.","title":"Il secolo del cambiamento","folio":"76","kind":"divider"},{"image":"pages/page-77.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Il XIX secolo 78\nIl cambiamento nella vita quotidiana\nLezione 2 · Botteghe, imprese e lavoro 81\nProdurre di più, dipendere da altri\nSettimana II\nLezione 3 · La ricerca responsabile 84\nLa Carta del 1863\nLezione 4 · Crisi e controversie 87\n1871: i Calderoni; 1885: Greywick\nTraguardo\nLeggere il progresso attraverso lavoro, produzione, ricerca e responsabilità.\nLe tre pagine di ciascun incontro formano un solo percorso: spiegazione, nozioni e confronto in aula.","title":"Il programma dell’anno","folio":"77","kind":"theory"},{"image":"pages/page-78.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Settimana I\nIl XIX secolo\nIl cambiamento nella vita quotidiana\nLa società magica del 1890 non è immobile. Il programma richiama trasformazioni nei trasporti, nelle imprese e negli strumenti di lavoro. Una tradizione antica può convivere con un’organizzazione nuova: la durata di una conoscenza non implica che restino identici i modi di produrla, insegnarla e usarla.\nIl progresso va osservato attraverso attività concrete. Un collegamento più rapido cambia tempi e distanze; una distribuzione più ampia modifica chi può procurarsi un oggetto. Per comprendere il cambiamento bisogna chiedersi chi ne benefici, chi ne sostenga il costo e quali abitudini siano messe in discussione.\nLa presenza di un’invenzione non prova che tutti possano accedervi. Differenze di reddito, territorio e mestiere possono produrre esperienze diverse dello stesso secolo. Lo storico studia questi rapporti senza ridurre l’epoca a un elenco di grandi nomi e nuove meraviglie.\nRiferimento: Programma, lezione 11.","title":"Il XIX secolo","folio":"78","kind":"theory"},{"image":"pages/page-79.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 1\nLe nozioni da ricordare\nIl XIX secolo\nInnovazione\nÈ una novità relativa a un contesto; la sua introduzione non coincide con una diffusione universale.\nContinuità e cambiamento\nUna società può conservare tradizioni e modificare profondamente le proprie condizioni materiali.\nAccesso\nDisponibilità di un prodotto e possibilità concreta di procurarselo sono aspetti differenti.\nDomanda da discutere\nQuale oggetto quotidiano vi sembra tanto normale da farvi dimenticare che qualcuno ha dovuto introdurlo?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Il XIX secolo · Nozioni","folio":"79","kind":"theory"},{"image":"pages/page-80.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 1\nIl confronto in aula\nIl XIX secolo · Scheda della lezione\nApertura\nQuale oggetto quotidiano vi sembra tanto normale da farvi dimenticare che qualcuno ha dovuto introdurlo?\n1. Scegliere uno strumento ordinario senza attribuirgli una data d’invenzione non documentata.\n2. Confrontare un uso familiare, professionale e scolastico.\n3. Indicare un gruppo che potrebbe beneficiarne e una difficoltà di accesso.\nDomanda di ripasso\nUn oggetto nuovo cambia subito allo stesso modo la vita di tutti?\nRisposta ragionata\nNo. Diffusione, costo e condizioni d’uso determinano conseguenze differenti.","title":"Il XIX secolo · Attività e ripasso","folio":"80","kind":"theory"},{"image":"pages/page-81.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Settimana I\nBotteghe, imprese e lavoro\nProdurre di più, dipendere da altri\nL’organizzazione della produzione modifica il rapporto tra chi costruisce, vende e utilizza gli strumenti. Una bottega può conoscere direttamente i propri clienti; un’impresa più ampia può raggiungere luoghi lontani, ma deve coordinare materiali, informazioni e controllo dei prodotti.\nLa diffusione accresce opportunità e responsabilità. Se molti strumenti condividono lo stesso difetto, un problema non resta confinato a un solo banco di lavoro. La reputazione del produttore può orientare la fiducia, ma non sostituisce la verifica di ciò che viene distribuito.\nPer leggere la storia economica occorre ascoltare soggetti differenti: artigiani, lavoratori, compratori e autorità. Una procedura considerata utile da un gruppo può essere percepita come un costo da un altro. Capire questa differenza non significa attribuire automaticamente ragione a tutte le parti.\nRiferimento: Programma, lezione 11.","title":"Botteghe, imprese e lavoro","folio":"81","kind":"theory"},{"image":"pages/page-82.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 2\nLe nozioni da ricordare\nBotteghe, imprese e lavoro\nScala della produzione\nAumentare la distribuzione può estendere sia i benefici sia le conseguenze di un difetto.\nReputazione e riscontro\nLa fiducia accumulata non rende impossibile un errore presente.\nInteressi differenti\nPosizioni contrarie vanno confrontate con prove e condizioni materiali, non solo con la forza del linguaggio.\nDomanda da discutere\nPreferireste un oggetto fatto da un artigiano conosciuto o uno prodotto in molti esemplari? Quali informazioni vi servono?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"Botteghe, imprese e lavoro · Nozioni","folio":"82","kind":"theory"},{"image":"pages/page-83.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 2\nIl confronto in aula\nBotteghe, imprese e lavoro · Scheda della lezione\nApertura\nPreferireste un oggetto fatto da un artigiano conosciuto o uno prodotto in molti esemplari? Quali informazioni vi servono?\n1. Confrontare due produttori immaginari, evitando di stabilire in anticipo quale sia migliore.\n2. Chiedere a ciascun gruppo quali dati vorrebbe su materiali, controlli e manutenzione.\n3. Collegare il confronto alla distribuzione dei rischi, senza trasformare l’esempio in un episodio storico.\nDomanda di ripasso\nUna produzione più ampia garantisce automaticamente maggiore affidabilità?\nRisposta ragionata\nNo. Quantità, organizzazione e controllo sono variabili distinte. L’affidabilità richiede riscontri.","title":"Botteghe, imprese e lavoro · Attività e ripasso","folio":"83","kind":"theory"},{"image":"pages/page-84.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Settimana II\nLa ricerca responsabile\nLa Carta del 1863\nLa Carta della Ricerca Responsabile del 1863, nel programma, introduce il problema dei limiti della sperimentazione. Una ricerca può perseguire un obiettivo utile e impiegare mezzi inadeguati. La valutazione dello scopo deve quindi essere accompagnata dall’esame delle condizioni di lavoro e delle conseguenze prevedibili.\nLa reputazione di uno studioso non sostituisce la documentazione. Per valutare una proposta occorre conoscere quali prove siano state svolte, in quali condizioni e con quali risultati, compresi quelli sfavorevoli. Una conclusione non diventa più solida eliminando dal resoconto ciò che non vi si adatta.\nRicercatori e autorità possiedono competenze differenti e possono avere interessi diversi. Il problema non consiste nel scegliere in astratto tra libertà assoluta e divieto generale. Consiste nel comprendere come una comunità costruisca verifiche, responsabilità e limiti riconoscibili.\nRiferimento: Programma, lezione 12.","title":"La ricerca responsabile","folio":"84","kind":"theory"},{"image":"pages/page-85.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 3\nLe nozioni da ricordare\nLa ricerca responsabile\nScopo e mezzi\nLa desiderabilità del risultato non dimostra l’adeguatezza di qualsiasi procedura.\nVerificabilità\nRendere note condizioni e risultati permette un esame che non dipenda soltanto dalla fiducia personale.\nEsiti sfavorevoli\nSono informazioni rilevanti per ricostruire il lavoro e valutarne i limiti.\nDomanda da discutere\nLa garanzia di uno studioso celebre sarebbe sufficiente senza alcun resoconto delle prove?\nPer motivare una risposta, collegare il concetto a un esempio della spiegazione. Un’opinione ragionata può essere discussa; una notizia nuova richiede una fonte.","title":"La ricerca responsabile · Nozioni","folio":"85","kind":"theory"},{"image":"pages/page-86.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Lectio 3\nIl confronto in aula\nLa ricerca responsabile · Scheda della lezione\nApertura\nLa garanzia di uno studioso celebre sarebbe sufficiente senza alcun resoconto delle prove?\n1. Presentare un progetto immaginario con un obiettivo utile ma informazioni incomplete.\n2. Far elencare le domande necessarie prima di valutarlo.\n3. Separare il giudizio sulla promessa del progetto da quello sulle verifiche disponibili.\nDomanda di ripasso\nUn’intenzione positiva dimostra che ogni mezzo impiegato sia giustificato?\nRisposta ragionata\nNo. Obiettivo, metodo, rischi e responsabilità devono essere valutati distintamente.","title":"La ricerca responsabile · Attività e ripasso","folio":"86","kind":"theory"},{"image":"pages/page-87.svg?v=20261121-1","text":"DE ORIGINIBUS MAGIAE\nAnno VI · Settimana II\nCrisi e controversie\n1871: i Calderoni; 1885: Greywick\nLa crisi dei Calderoni del 1871 offre, nel programma, un riferimento al rapporto tra produzione e affidabilità degli strumenti. Il materiale non fornisce una ricostruzione tecnica completa: non si attribuiscono quindi al caso un difetto preciso, un numero di incidenti o responsabilità personali non documentate.\nIl Caso Greywick del 1885 avvicina lo studio della responsabilità al presente. Permette di discutere una controversia nella quale rischi e benefici della ricerca richiedono valutazione. Anche qui il valore didattico non autorizza a inventare il contenuto di un esperimento o l’esito di un giudizio.\nLe discussioni possono usare esempi immaginari, purché restino distinguibili dagli eventi del programma. Il sesto anno si conclude applicando lo stesso criterio alla storia economica e scientifica: ricostruire ciò che era noto, le alternative considerate e i limiti delle prove disponibili.
